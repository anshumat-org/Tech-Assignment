<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Permission denied notice wireframe</title>
  <desc id="d">Sample wireframe: explains the effect of a permanently denied camera, offers the gallery and Open settings. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">LTE 80%</text>
  <text x="16" y="58" font-size="20" fill="#ffffff">←</text><text x="48" y="57" font-size="17" fill="#ffffff" font-weight="700">New report</text>
  <rect x="16" y="96" width="328" height="48" rx="8" fill="#eef3f7" stroke="#b42318"/><rect x="16" y="96" width="6" height="48" rx="3" fill="#b42318"/><text x="32" y="114" font-size="12" fill="#14263f" font-weight="600">⊘ Camera access is off</text><text x="32" y="130" font-size="11" fill="#5b6b7d">Permanently denied in system settings.</text>
  <text x="16" y="184" font-size="14" fill="#14263f">You can still add a photo from your</text>
  <text x="16" y="206" font-size="14" fill="#14263f">gallery, or turn the camera on in</text>
  <text x="16" y="228" font-size="14" fill="#14263f">Settings and come back.</text>
  <rect x="16" y="270" width="328" height="48" rx="8" fill="#0e9384"/><text x="180.0" y="299.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Choose from gallery</text>
  <rect x="16" y="330" width="328" height="48" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="180.0" y="359.0" font-size="14" fill="#14263f" font-weight="600" text-anchor="middle">Open settings</text>
  <text x="180.0" y="415.0" font-size="14" fill="#0e9384" font-weight="600" text-anchor="middle">Continue without photo</text>
  <rect x="16" y="460" width="328" height="72" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="32" y="486" font-size="12" fill="#5b6b7d" font-weight="700">Location denied?</text><text x="32" y="508" font-size="12" fill="#14263f">Type the place by hand instead.</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
</svg>
