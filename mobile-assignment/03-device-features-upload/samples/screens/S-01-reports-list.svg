<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Reports list wireframe</title>
  <desc id="d">Sample wireframe: report rows with upload state and progress, Retry on failed, Cancel on uploading, New report. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">LTE 80%</text>
  <text x="16" y="57" font-size="18" fill="#ffffff" font-weight="700">Reports</text>
  <rect x="16" y="96" width="328" height="80" rx="8" fill="#ffffff" stroke="#d5dee6"/><rect x="28" y="108" width="56" height="56" rx="6" fill="#eef3f7"/><text x="56" y="141" font-size="10" fill="#5b6b7d" text-anchor="middle">photo</text><text x="96" y="124" font-size="14" fill="#14263f" font-weight="700">Site visit A (placeholder)</text><rect x="96" y="136" width="107" height="20" rx="10" fill="#ffffff" stroke="#0e9384"/><text x="149.5" y="150" font-size="11" fill="#0e9384" font-weight="600" text-anchor="middle">↑ Uploading 62%</text><rect x="96" y="162" width="160" height="6" rx="3" fill="#eef3f7"/><rect x="96" y="162" width="99" height="6" rx="3" fill="#0e9384"/><text x="332" y="150" font-size="12" fill="#b42318" font-weight="700" text-anchor="end">Cancel</text>
  <rect x="16" y="188" width="328" height="80" rx="8" fill="#ffffff" stroke="#d5dee6"/><rect x="28" y="200" width="56" height="56" rx="6" fill="#eef3f7"/><text x="56" y="233" font-size="10" fill="#5b6b7d" text-anchor="middle">photo</text><text x="96" y="216" font-size="14" fill="#14263f" font-weight="700">Broken gate (placeholder)</text><rect x="96" y="228" width="125" height="20" rx="10" fill="#ffffff" stroke="#b42318"/><text x="158.5" y="242" font-size="11" fill="#b42318" font-weight="600" text-anchor="middle">! Failed · network</text><text x="332" y="242" font-size="12" fill="#0e9384" font-weight="700" text-anchor="end">Retry</text>
  <rect x="16" y="280" width="328" height="80" rx="8" fill="#ffffff" stroke="#d5dee6"/><rect x="28" y="292" width="56" height="56" rx="6" fill="#eef3f7"/><text x="56" y="325" font-size="10" fill="#5b6b7d" text-anchor="middle">photo</text><text x="96" y="308" font-size="14" fill="#14263f" font-weight="700">Water leak (placeholder)</text><rect x="96" y="320" width="63" height="20" rx="10" fill="#ffffff" stroke="#b26a00"/><text x="127.5" y="334" font-size="11" fill="#b26a00" font-weight="600" text-anchor="middle">⏱ Queued</text>
  <rect x="16" y="372" width="328" height="80" rx="8" fill="#ffffff" stroke="#d5dee6"/><rect x="28" y="384" width="56" height="56" rx="6" fill="#eef3f7"/><text x="56" y="417" font-size="10" fill="#5b6b7d" text-anchor="middle">photo</text><text x="96" y="400" font-size="14" fill="#14263f" font-weight="700">Signage (placeholder)</text><rect x="96" y="412" width="76" height="20" rx="10" fill="#ffffff" stroke="#1a7f4b"/><text x="134.0" y="426" font-size="11" fill="#1a7f4b" font-weight="600" text-anchor="middle">✓ Uploaded</text>
