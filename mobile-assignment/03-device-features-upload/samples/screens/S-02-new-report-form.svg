<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">New report form wireframe</title>
  <desc id="d">Sample wireframe: title, note, photo slot, location field and Save that queues the report. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">LTE 80%</text>
  <text x="16" y="58" font-size="20" fill="#ffffff">←</text><text x="48" y="57" font-size="17" fill="#ffffff" font-weight="700">New report</text>
  <text x="16" y="108" font-size="12" fill="#5b6b7d" font-weight="600">Title</text><rect x="16" y="114" width="328" height="44" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="28" y="141.0" font-size="14" fill="#14263f">Broken gate (placeholder)</text>
  <text x="16" y="188" font-size="12" fill="#5b6b7d" font-weight="600">Note</text><rect x="16" y="194" width="328" height="84" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="28" y="220" font-size="14" fill="#14263f">Hinge loose on the left side.</text><text x="28" y="242" font-size="14" fill="#5b6b7d">(placeholder)</text>
  <text x="16" y="306" font-size="12" fill="#5b6b7d" font-weight="600">Photo</text>
  <rect x="16" y="312" width="120" height="120" rx="8" fill="#eef3f7" stroke="#d5dee6"/><text x="76" y="377" font-size="12" fill="#5b6b7d" text-anchor="middle">photo</text>
  <rect x="148" y="312" width="120" height="120" rx="8" fill="#ffffff" stroke="#0e9384" stroke-dasharray="5 4"/><text x="208" y="368" font-size="22" fill="#0e9384" font-weight="700" text-anchor="middle">+</text><text x="208" y="392" font-size="13" fill="#0e9384" font-weight="600" text-anchor="middle">Add photo</text>
  <text x="16" y="460" font-size="12" fill="#5b6b7d" font-weight="600">Location</text><rect x="16" y="466" width="328" height="52" rx="8" fill="#ffffff" stroke="#d5dee6"/>
  <text x="28" y="488" font-size="13" fill="#14263f" font-weight="600">⌖ Near Sample Street (placeholder)</text><text x="28" y="508" font-size="11" fill="#5b6b7d">±25 m · Change</text>
  <rect x="16" y="548" width="328" height="48" rx="8" fill="#0e9384"/><text x="180.0" y="577.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Save</text>
  <text x="180" y="620" font-size="12" fill="#5b6b7d" text-anchor="middle">Saved reports upload in the background.</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
</svg>
