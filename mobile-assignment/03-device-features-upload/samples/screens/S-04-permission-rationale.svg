<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Permission rationale wireframe</title>
  <desc id="d">Sample wireframe: in-app reason for camera access shown before the system prompt, with Continue and Not now. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">LTE 80%</text>
  <text x="16" y="58" font-size="20" fill="#ffffff">←</text><text x="48" y="57" font-size="17" fill="#ffffff" font-weight="700">New report</text>
  <rect x="140" y="150" width="80" height="80" rx="40" fill="#eef3f7" stroke="#d5dee6"/><text x="180" y="200" font-size="30" fill="#0e9384" text-anchor="middle">◉</text>
  <text x="180" y="276" font-size="20" fill="#14263f" font-weight="700" text-anchor="middle">Allow camera access?</text>
  <text x="180" y="312" font-size="14" fill="#5b6b7d" text-anchor="middle">We use the camera only when you tap</text>
  <text x="180" y="334" font-size="14" fill="#5b6b7d" text-anchor="middle">Take photo, to attach a picture to</text>
  <text x="180" y="356" font-size="14" fill="#5b6b7d" text-anchor="middle">this report. Nothing is recorded</text>
  <text x="180" y="378" font-size="14" fill="#5b6b7d" text-anchor="middle">in the background.</text>
  <rect x="40" y="410" width="280" height="44" rx="8" fill="#eef3f7" stroke="#d5dee6"/><text x="180" y="437" font-size="12" fill="#14263f" text-anchor="middle">Next: your phone will ask you</text>
  <rect x="16" y="560" width="328" height="48" rx="8" fill="#0e9384"/><text x="180.0" y="589.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Continue</text><rect x="16" y="616" width="328" height="48" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="180.0" y="645.0" font-size="14" fill="#14263f" font-weight="600" text-anchor="middle">Not now</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
</svg>
