<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Report detail too large wireframe</title>
  <desc id="d">Sample wireframe: failed upload because the photo is too large (413), with reason and Retry. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">LTE 80%</text>
  <text x="16" y="58" font-size="20" fill="#ffffff">←</text><text x="48" y="57" font-size="17" fill="#ffffff" font-weight="700">Report</text>
  <rect x="16" y="92" width="328" height="180" rx="8" fill="#eef3f7" stroke="#d5dee6"/><text x="180" y="188" font-size="13" fill="#5b6b7d" text-anchor="middle">Photo (placeholder)</text>
  <text x="16" y="304" font-size="18" fill="#14263f" font-weight="700">Broken gate (placeholder)</text>
  <text x="16" y="328" font-size="13" fill="#5b6b7d">Hinge loose on the left side.</text>
  <text x="16" y="352" font-size="12" fill="#14263f">⌖ Near Sample Street · ±25 m</text>
  <rect x="16" y="370" width="138" height="20" rx="10" fill="#ffffff" stroke="#b42318"/><text x="85.0" y="384" font-size="11" fill="#b42318" font-weight="600" text-anchor="middle">! Failed · too large</text>
  <rect x="16" y="408" width="328" height="52" rx="8" fill="#eef3f7" stroke="#b42318"/><rect x="16" y="408" width="6" height="52" rx="3" fill="#b42318"/><text x="32" y="426" font-size="12" fill="#14263f" font-weight="600">! Photo is too large to upload</text><text x="32" y="442" font-size="11" fill="#5b6b7d">Server limit 5 MB (HTTP 413). Retake or pick a smaller one.</text>
  <rect x="16" y="476" width="328" height="44" rx="8" fill="#0e9384"/><text x="180.0" y="503.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Replace photo</text>
  <rect x="16" y="528" width="328" height="44" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="180.0" y="555.0" font-size="14" fill="#14263f" font-weight="600" text-anchor="middle">Retry</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
</svg>
