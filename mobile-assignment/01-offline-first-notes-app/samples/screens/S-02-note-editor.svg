<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Note editor wireframe</title>
  <desc id="d">Sample wireframe: title, body, sync state after save while offline, Save and Delete. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">No network</text>
  <text x="16" y="58" font-size="20" fill="#ffffff">←</text><text x="48" y="57" font-size="17" fill="#ffffff" font-weight="700">Edit note</text>
  <text x="344" y="57" font-size="13" fill="#ffffff" font-weight="600" text-anchor="end">Save</text>
  <rect x="16" y="96" width="212" height="20" rx="10" fill="#ffffff" stroke="#b26a00"/><text x="122.0" y="110" font-size="11" fill="#b26a00" font-weight="600" text-anchor="middle">⏱ Pending · saved on this device</text>
  <text x="16" y="136" font-size="12" fill="#5b6b7d">Last edited 09:38 · not yet on server</text>
  <text x="16" y="166" font-size="12" fill="#5b6b7d" font-weight="600">Title</text><rect x="16" y="172" width="328" height="44" rx="8" fill="#ffffff" stroke="#1d6fe0" stroke-width="2"/><text x="28" y="199.0" font-size="14" fill="#14263f">Meeting notes (placeholder)</text>
  <text x="16" y="248" font-size="12" fill="#5b6b7d" font-weight="600">Body</text><rect x="16" y="254" width="328" height="300" rx="8" fill="#ffffff" stroke="#d5dee6"/>
  <text x="28" y="282" font-size="14" fill="#14263f">Agenda (placeholder)</text>
  <text x="28" y="306" font-size="14" fill="#14263f">1. Review last week</text>
  <text x="28" y="330" font-size="14" fill="#14263f">2. Plan next sprint</text>
  <text x="28" y="354" font-size="14" fill="#14263f">3. Any other business</text>
  <rect x="16" y="570" width="328" height="40" rx="8" fill="#eef3f7" stroke="#b26a00"/><rect x="16" y="570" width="6" height="40" rx="3" fill="#b26a00"/><text x="32" y="595.0" font-size="12" fill="#14263f" font-weight="600">Offline · this note will sync later</text>
  <rect x="16" y="630" width="156" height="40" rx="8" fill="#ffffff" stroke="#b42318"/><text x="94.0" y="655.0" font-size="14" fill="#b42318" font-weight="600" text-anchor="middle">Delete</text><rect x="188" y="630" width="156" height="40" rx="8" fill="#0e9384"/><text x="266.0" y="655.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Save</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
</svg>
