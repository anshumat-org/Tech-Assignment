<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Notes list wireframe</title>
  <desc id="d">Sample wireframe: search, note rows with sync state, offline banner, retry on a failed row and New note. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">No network</text>
  <text x="16" y="57" font-size="18" fill="#ffffff" font-weight="700">Notes</text>
  <text x="344" y="57" font-size="13" fill="#ffffff" font-weight="600" text-anchor="end">Sync now</text>
  <rect x="16" y="92" width="328" height="48" rx="8" fill="#eef3f7" stroke="#b26a00"/><rect x="16" y="92" width="6" height="48" rx="3" fill="#b26a00"/><text x="32" y="110" font-size="12" fill="#14263f" font-weight="600">⚠ Offline · changes saved on this device</text><text x="32" y="126" font-size="11" fill="#5b6b7d">3 waiting to sync. They send when you reconnect.</text>
  <rect x="16" y="152" width="328" height="40" rx="20" fill="#eef3f7" stroke="#d5dee6"/><text x="36" y="177" font-size="14" fill="#5b6b7d">⌕  Search notes</text>
  <rect x="16" y="206" width="328" height="72" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="28" y="232" font-size="14" fill="#14263f" font-weight="700">Shopping list (placeholder)</text><text x="28" y="254" font-size="12" fill="#5b6b7d">Milk, rice, lentils…</text><rect x="269" y="218" width="63" height="20" rx="10" fill="#ffffff" stroke="#1a7f4b"/><text x="300.5" y="232" font-size="11" fill="#1a7f4b" font-weight="600" text-anchor="middle">✓ Synced</text>
  <rect x="16" y="286" width="328" height="72" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="28" y="312" font-size="14" fill="#14263f" font-weight="700">Meeting notes (placeholder)</text><text x="28" y="334" font-size="12" fill="#5b6b7d">Agenda items for Friday…</text><rect x="263" y="298" width="69" height="20" rx="10" fill="#ffffff" stroke="#b26a00"/><text x="297.5" y="312" font-size="11" fill="#b26a00" font-weight="600" text-anchor="middle">⏱ Pending</text>
  <rect x="16" y="366" width="328" height="72" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="28" y="392" font-size="14" fill="#14263f" font-weight="700">Ideas (placeholder)</text><text x="28" y="414" font-size="12" fill="#5b6b7d">Weekend plan draft…</text><rect x="269" y="378" width="63" height="20" rx="10" fill="#ffffff" stroke="#b42318"/><text x="300.5" y="392" font-size="11" fill="#b42318" font-weight="600" text-anchor="middle">! Failed</text><text x="332" y="424" font-size="12" fill="#0e9384" font-weight="700" text-anchor="end">Retry</text>
  <rect x="16" y="446" width="328" height="72" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="28" y="472" font-size="14" fill="#14263f" font-weight="700">Recipe (placeholder)</text><text x="28" y="494" font-size="12" fill="#5b6b7d">Two versions found…</text><rect x="256" y="458" width="76" height="20" rx="10" fill="#ffffff" stroke="#b26a00"/><text x="294.0" y="472" font-size="11" fill="#b26a00" font-weight="600" text-anchor="middle">⚠ Conflict</text><text x="332" y="504" font-size="12" fill="#0e9384" font-weight="700" text-anchor="end">Resolve</text>
  <rect x="16" y="526" width="328" height="72" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="28" y="552" font-size="14" fill="#14263f" font-weight="700">Reading list (placeholder)</text><text x="28" y="574" font-size="12" fill="#5b6b7d">Three books for…</text><rect x="269" y="538" width="63" height="20" rx="10" fill="#ffffff" stroke="#1a7f4b"/><text x="300.5" y="552" font-size="11" fill="#1a7f4b" font-weight="600" text-anchor="middle">✓ Synced</text>
  <rect x="268" y="620" width="76" height="56" rx="28" fill="#0e9384"/><text x="306" y="653" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">+ New</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
</svg>
