<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Conflict resolution wireframe</title>
  <desc id="d">Sample wireframe: this device's version beside the server version with Keep mine and Keep theirs. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">LTE 80%</text>
  <text x="16" y="58" font-size="20" fill="#ffffff">←</text><text x="48" y="57" font-size="17" fill="#ffffff" font-weight="700">Resolve conflict</text>
  <rect x="16" y="92" width="328" height="48" rx="8" fill="#eef3f7" stroke="#b26a00"/><rect x="16" y="92" width="6" height="48" rx="3" fill="#b26a00"/><text x="32" y="110" font-size="12" fill="#14263f" font-weight="600">⚠ Conflict · edited on two devices</text><text x="32" y="126" font-size="11" fill="#5b6b7d">Choose which version to keep.</text>
  <rect x="16" y="158" width="328" height="196" rx="8" fill="#ffffff" stroke="#0e9384" stroke-width="2"/>
  <text x="32" y="186" font-size="14" fill="#14263f" font-weight="700">Mine · this phone</text><text x="32" y="206" font-size="12" fill="#5b6b7d">Edited 09:38 (placeholder)</text>
  <text x="32" y="242" font-size="13" fill="#14263f" font-weight="600">Recipe (placeholder)</text>
  <text x="32" y="264" font-size="13" fill="#14263f">2 cups rice, 1 onion,</text>
  <text x="32" y="286" font-size="13" fill="#14263f">salt to taste</text>
  <rect x="16" y="370" width="328" height="196" rx="8" fill="#ffffff" stroke="#d5dee6"/>
  <text x="32" y="398" font-size="14" fill="#14263f" font-weight="700">Theirs · other device</text><text x="32" y="418" font-size="12" fill="#5b6b7d">Edited 09:41 (placeholder)</text>
  <text x="32" y="454" font-size="13" fill="#14263f" font-weight="600">Recipe (placeholder)</text>
  <text x="32" y="476" font-size="13" fill="#14263f">2 cups rice, 2 onions,</text>
  <text x="32" y="498" font-size="13" fill="#14263f">chilli, salt to taste</text>
  <rect x="16" y="590" width="156" height="40" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="94.0" y="615.0" font-size="14" fill="#14263f" font-weight="600" text-anchor="middle">Keep mine</text><rect x="188" y="590" width="156" height="40" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="266.0" y="615.0" font-size="14" fill="#14263f" font-weight="600" text-anchor="middle">Keep theirs</text>
  <text x="180" y="656" font-size="12" fill="#5b6b7d" text-anchor="middle">Unchosen version is discarded</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
</svg>
