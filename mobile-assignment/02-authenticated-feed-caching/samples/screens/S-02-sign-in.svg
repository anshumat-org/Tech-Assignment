<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sign in wireframe</title>
  <desc id="d">Sample wireframe: email and password with inline validation, a session-expired message and Sign in. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">LTE 80%</text>
  <text x="16" y="57" font-size="18" fill="#ffffff" font-weight="700">Sign in</text>
  <rect x="16" y="96" width="328" height="40" rx="8" fill="#eef3f7" stroke="#1d6fe0"/><rect x="16" y="96" width="6" height="40" rx="3" fill="#1d6fe0"/><text x="32" y="121.0" font-size="12" fill="#14263f" font-weight="600">ⓘ Session expired · please sign in again</text>
  <text x="16" y="172" font-size="20" fill="#14263f" font-weight="700">Welcome back</text>
  <text x="16" y="196" font-size="13" fill="#5b6b7d">Sign in to see your feed.</text>
  <text x="16" y="232" font-size="12" fill="#5b6b7d" font-weight="600">Email</text><rect x="16" y="238" width="328" height="44" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="28" y="265.0" font-size="14" fill="#14263f">reader@example.test</text>
  <text x="16" y="312" font-size="12" fill="#5b6b7d" font-weight="600">Password</text><rect x="16" y="318" width="328" height="44" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="2"/><text x="28" y="345.0" font-size="14" fill="#14263f">••••</text><text x="16" y="380" font-size="12" fill="#b42318">! Password must be at least 8 characters</text>
  <rect x="16" y="420" width="328" height="48" rx="8" fill="#0e9384"/><text x="180.0" y="449.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Sign in</text>
  <text x="180" y="494" font-size="12" fill="#5b6b7d" text-anchor="middle">Test account only (placeholder)</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
</svg>
