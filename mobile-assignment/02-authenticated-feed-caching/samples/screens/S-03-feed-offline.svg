<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Feed offline wireframe</title>
  <desc id="d">Sample wireframe: offline banner over the cached feed and an inline page error with Retry. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect width="360" height="80" fill="#14263f"/>
  <text x="16" y="17" font-size="11" fill="#ffffff">9:41</text><text x="344" y="17" font-size="11" fill="#ffffff" text-anchor="end">No network</text>
  <text x="16" y="57" font-size="18" fill="#ffffff" font-weight="700">Feed</text>
  <text x="344" y="57" font-size="13" fill="#ffffff" font-weight="600" text-anchor="end">Sign out</text>
  <rect x="16" y="92" width="328" height="48" rx="8" fill="#eef3f7" stroke="#b26a00"/><rect x="16" y="92" width="6" height="48" rx="3" fill="#b26a00"/><text x="32" y="110" font-size="12" fill="#14263f" font-weight="600">⚠ Offline · showing saved posts</text><text x="32" y="126" font-size="11" fill="#5b6b7d">Last updated 09:12. Pull to retry.</text>
  <rect x="16" y="156" width="328" height="96" rx="8" fill="#ffffff" stroke="#d5dee6"/><rect x="28" y="168" width="72" height="72" rx="6" fill="#eef3f7"/><text x="64" y="209" font-size="11" fill="#5b6b7d" text-anchor="middle">img</text><text x="112" y="188" font-size="14" fill="#14263f" font-weight="700">Post title 1 (placeholder)</text><text x="112" y="208" font-size="12" fill="#5b6b7d">Short summary text</text><text x="112" y="228" font-size="11" fill="#5b6b7d">Author B · yesterday</text>
  <rect x="16" y="264" width="328" height="96" rx="8" fill="#ffffff" stroke="#d5dee6"/><rect x="28" y="276" width="72" height="72" rx="6" fill="#eef3f7"/><text x="64" y="317" font-size="11" fill="#5b6b7d" text-anchor="middle">img</text><text x="112" y="296" font-size="14" fill="#14263f" font-weight="700">Post title 2 (placeholder)</text><text x="112" y="316" font-size="12" fill="#5b6b7d">Short summary text</text><text x="112" y="336" font-size="11" fill="#5b6b7d">Author B · yesterday</text>
  <rect x="16" y="372" width="328" height="96" rx="8" fill="#ffffff" stroke="#d5dee6"/><rect x="28" y="384" width="72" height="72" rx="6" fill="#eef3f7"/><text x="64" y="425" font-size="11" fill="#5b6b7d" text-anchor="middle">img</text><text x="112" y="404" font-size="14" fill="#14263f" font-weight="700">Post title 3 (placeholder)</text><text x="112" y="424" font-size="12" fill="#5b6b7d">Short summary text</text><text x="112" y="444" font-size="11" fill="#5b6b7d">Author B · yesterday</text>
  <rect x="16" y="488" width="328" height="76" rx="8" fill="#eef3f7" stroke="#b42318"/>
  <text x="32" y="516" font-size="13" fill="#b42318" font-weight="700">! Could not load more posts</text>
  <text x="32" y="538" font-size="12" fill="#5b6b7d">Check your connection.</text>
  <rect x="256" y="506" width="76" height="36" rx="8" fill="#0e9384"/><text x="294.0" y="529.0" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Retry</text>
  <rect x="16" y="584" width="328" height="56" rx="8" fill="#ffffff" stroke="#d5dee6" stroke-dasharray="4 4"/><text x="180" y="617" font-size="12" fill="#5b6b7d" text-anchor="middle">End of saved posts</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
</svg>
