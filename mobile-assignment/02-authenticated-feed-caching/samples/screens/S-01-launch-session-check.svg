  <text x="56" y="588" font-size="12" fill="#14263f">Tokens found → cached feed</text>
  <text x="56" y="608" font-size="12" fill="#14263f">No tokens → Sign in</text>
  <rect x="130" y="704" width="100" height="4" rx="2" fill="#d5dee6"/>
