<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" font-size="12" fill="#14263f" role="img" aria-labelledby="t d">
  <title id="t">Tooltip and Badge specimen board</title>
  <desc id="d">Sample specimen board: status Badges with icon and text, and a Tooltip hidden, shown on keyboard focus and shown on hover. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="44" fill="#14263f"/>
  <text x="24" y="28" fill="#fff" font-size="15" font-weight="700">Component library demo (sample)</text>
  <rect x="640" y="10" width="136" height="24" rx="12" fill="#fff"/>
  <text x="708" y="26" font-weight="700" text-anchor="middle">Theme: Light ▾</text>
  <text x="24" y="76" font-size="18" font-weight="700">Tooltip and Badge (optional)</text>
  <text x="24" y="96" fill="#5b6b7d">Status uses text or an icon, never colour alone. Tooltip shows on focus and hover.</text>
  <text x="24" y="128" font-weight="700">Badges</text>
  <rect x="24" y="140" width="71" height="20" rx="10" fill="#fff" stroke="#1a7f4b"/><text x="59.5" y="154" fill="#1a7f4b" font-weight="700" text-anchor="middle">✓ Active</text>
  <rect x="134" y="140" width="78" height="20" rx="10" fill="#fff" stroke="#b26a00"/><text x="173.0" y="154" fill="#b26a00" font-weight="700" text-anchor="middle">⚠ Pending</text>
  <rect x="244" y="140" width="71" height="20" rx="10" fill="#fff" stroke="#b42318"/><text x="279.5" y="154" fill="#b42318" font-weight="700" text-anchor="middle">✕ Failed</text>
  <rect x="354" y="140" width="64" height="20" rx="10" fill="#fff" stroke="#5b6b7d"/><text x="386.0" y="154" fill="#5b6b7d" font-weight="700" text-anchor="middle">● Draft</text>
  <rect x="464" y="140" width="57" height="20" rx="10" fill="#fff" stroke="#1d6fe0"/><text x="492.5" y="154" fill="#1d6fe0" font-weight="700" text-anchor="middle">i Info</text>
  <text x="24" y="196" fill="#5b6b7d" font-size="11" font-weight="700">Tooltip · hidden</text>
  <rect x="24" y="206" width="32" height="32" rx="16" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="227" font-size="14" font-weight="700" text-anchor="middle">?</text>
  <text x="68" y="227" fill="#5b6b7d">Help icon (button)</text>
  <text x="300" y="196" fill="#5b6b7d" font-size="11" font-weight="700">Tooltip · shown on focus</text>
  <rect x="300" y="270" width="32" height="32" rx="16" fill="#fff" stroke="#d5dee6"/>
  <text x="316" y="291" font-size="14" font-weight="700" text-anchor="middle">?</text>
  <rect x="297" y="267" width="38" height="38" rx="19" fill="none" stroke="#1d6fe0" stroke-width="2"/>
  <rect x="272" y="210" width="232" height="44" rx="6" fill="#14263f"/>
  <text x="284" y="230" fill="#fff" font-weight="700">Amount includes tax</text>
  <text x="284" y="246" fill="#fff" font-size="11">(placeholder text)</text>
  <path d="M308 254l8 8 8-8z" fill="#14263f"/>
  <text x="560" y="196" fill="#5b6b7d" font-size="11" font-weight="700">Tooltip · shown on hover</text>
  <rect x="560" y="270" width="32" height="32" rx="16" fill="#fff" stroke="#d5dee6"/>
  <text x="576" y="291" font-size="14" font-weight="700" text-anchor="middle">?</text>
  <path d="M584 290v13l3-3 3 6 2-1-3-6h4z" fill="#14263f" stroke="#fff"/>
  <rect x="532" y="210" width="232" height="44" rx="6" fill="#14263f"/>
  <text x="544" y="236" fill="#fff" font-weight="700">Same text as focus</text>
  <path d="M568 254l8 8 8-8z" fill="#14263f"/>
  <text x="24" y="348" fill="#5b6b7d">Esc hides the tooltip. Tooltip text is linked with aria-describedby.</text>
  <rect x="24" y="370" width="111" height="20" rx="10" fill="#fff" stroke="#1d6fe0"/><text x="79.5" y="384" fill="#1d6fe0" font-size="11" font-weight="700" text-anchor="middle">Shown: on focus</text>
  <rect x="160" y="370" width="111" height="20" rx="10" fill="#fff" stroke="#14263f"/><text x="215.5" y="384" font-size="11" font-weight="700" text-anchor="middle">Shown: on hover</text>
</svg>
