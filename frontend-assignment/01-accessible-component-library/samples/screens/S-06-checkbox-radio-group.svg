  <rect x="630" y="148" width="16" height="16" rx="3" fill="#5b6b7d"/><path d="M634 156l3 3 6-6" fill="none" stroke="#fff" stroke-width="2"/><text x="656" y="161" fill="#5b6b7d" font-size="13">Email</text>
