<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" font-size="12" fill="#14263f" role="img" aria-labelledby="t d">
  <title id="t">Input section specimen board</title>
  <desc id="d">Sample specimen board: text Input with label and hint in default, focus, error and disabled states, plus a labelled anatomy example. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="44" fill="#14263f"/>
  <text x="24" y="28" fill="#fff" font-size="15" font-weight="700">Component library demo (sample)</text>
  <rect x="640" y="10" width="136" height="24" rx="12" fill="#fff"/>
  <text x="708" y="26" font-weight="700" text-anchor="middle">Theme: Light ▾</text>
  <text x="24" y="76" font-size="18" font-weight="700">Input</text>
  <text x="24" y="96" fill="#5b6b7d">Every field has a visible label. Hint and error are linked to the field.</text>
  <text x="24" y="124" fill="#5b6b7d" font-size="11" font-weight="700">Default</text><text x="216" y="124" fill="#5b6b7d" font-size="11" font-weight="700">Focus</text><text x="408" y="124" fill="#5b6b7d" font-size="11" font-weight="700">Error</text><text x="600" y="124" fill="#5b6b7d" font-size="11" font-weight="700">Disabled</text>
  <text x="24" y="156" font-weight="700">Email</text><rect x="24" y="164" width="176" height="32" rx="6" fill="#fff" stroke="#5b6b7d"/><text x="34" y="185.0" fill="#5b6b7d" font-size="13">name@example.test</text><text x="24" y="212" fill="#5b6b7d" font-size="11">We never share it.</text>
  <text x="216" y="156" font-weight="700">Email</text><rect x="216" y="164" width="176" height="32" rx="6" fill="#fff" stroke="#14263f"/><rect x="213" y="161" width="182" height="38" rx="9" fill="none" stroke="#1d6fe0" stroke-width="2"/><text x="226" y="185.0" font-size="13">sam@exa|</text><text x="216" y="212" fill="#5b6b7d" font-size="11">We never share it.</text>
  <text x="408" y="156" font-weight="700">Email</text><rect x="408" y="164" width="176" height="32" rx="6" fill="#fff" stroke="#b42318" stroke-width="2"/><text x="418" y="185.0" font-size="13">sam@</text><text x="408" y="212" fill="#b42318" font-size="11" font-weight="700">⚠ Enter a full email</text><text x="408" y="227" fill="#5b6b7d" font-size="11">We never share it.</text>
  <text x="600" y="156" fill="#5b6b7d" font-weight="700">Email</text><rect x="600" y="164" width="176" height="32" rx="6" fill="#eef3f7" stroke="#d5dee6"/><text x="610" y="185.0" fill="#5b6b7d" font-size="13">locked@example.test</text><text x="600" y="212" fill="#5b6b7d" font-size="11">Set by your admin.</text>
  <rect x="24" y="270" width="752" height="150" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="296" font-size="13" font-weight="700">Anatomy</text>
  <text x="40" y="322" font-weight="700">Full name (required)</text><rect x="40" y="330" width="300" height="32" rx="6" fill="#fff" stroke="#b42318" stroke-width="2"/><text x="50" y="351.0" font-size="13">Sample Person</text><text x="40" y="378" fill="#b42318" font-size="11" font-weight="700">⚠ Enter your full name</text><text x="40" y="393" fill="#5b6b7d" font-size="11">As on your ID card.</text>
  <text x="380" y="330" fill="#5b6b7d">1  Label above field</text>
  <text x="380" y="352" fill="#5b6b7d">2  Error text with icon, linked to field</text>
  <text x="380" y="374" fill="#5b6b7d">3  Hint text, linked to field</text>
  <text x="380" y="396" fill="#5b6b7d">4  Error border is thicker, not colour only</text>
  <rect x="24" y="436" width="143" height="20" rx="10" fill="#fff" stroke="#b42318"/><text x="95.5" y="450" fill="#b42318" font-size="11" font-weight="700" text-anchor="middle">⚠ State shown: error</text>
</svg>
