  <rect x="604" y="426" width="149" height="20" rx="10" fill="#fff" stroke="#5b6b7d"/><text x="678.5" y="440" fill="#5b6b7d" font-size="11" font-weight="700" text-anchor="middle">confirmed · cancelled</text>
  <rect x="24" y="330" width="303" height="20" rx="10" fill="#fff" stroke="#0e9384"/><text x="175.5" y="344" fill="#0e9384" font-size="11" font-weight="700" text-anchor="middle">States: idle · loading · results · no results</text>
