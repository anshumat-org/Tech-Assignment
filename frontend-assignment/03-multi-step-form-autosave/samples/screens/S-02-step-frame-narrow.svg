<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Arial, sans-serif" font-size="12" fill="#14263f" role="img" aria-labelledby="t d">
  <title id="t">Step frame narrow wireframe</title>
  <desc id="d">Sample narrow wireframe at 360 px: compact progress bar, Saving status, stacked fields with one error and one focused, full-width Back and Next. Illustrative only.</desc>
  <rect width="360" height="720" fill="#ffffff"/>
  <rect x="0" y="0" width="360" height="52" fill="#14263f"/>
  <text x="16" y="32" fill="#fff" font-size="15" font-weight="700">Sample form</text>
  <rect x="258" y="13" width="86" height="26" rx="13" fill="#fff" stroke="#5b6b7d"/><circle cx="272" cy="26" r="6" fill="none" stroke="#5b6b7d" stroke-width="2" stroke-dasharray="22 16"/><text x="312.0" y="31" fill="#5b6b7d" font-weight="700" text-anchor="middle">Saving…</text>
  <text x="16" y="84" font-size="13" font-weight="700">Step 2 of 4 · Contact</text>
  <rect x="16" y="94" width="328" height="8" rx="4" fill="#eef3f7" stroke="#d5dee6"/>
  <rect x="16" y="94" width="164" height="8" rx="4" fill="#0e9384"/>
  <text x="344" y="84" fill="#5b6b7d" font-size="11" text-anchor="end">50%</text>
  <text x="16" y="140" font-size="20" font-weight="700">Contact</text>
  <text x="16" y="172" font-weight="700">Email</text><rect x="16" y="180" width="328" height="40" rx="6" fill="#fff" stroke="#5b6b7d"/><text x="26" y="205.0" font-size="13">sam@example.test</text><text x="16" y="236" fill="#5b6b7d" font-size="11">We send the receipt here.</text>
  <text x="16" y="262" font-weight="700">Phone</text><rect x="16" y="270" width="328" height="40" rx="6" fill="#fff" stroke="#b42318" stroke-width="2"/><text x="26" y="295.0" font-size="13">98765</text><text x="16" y="326" fill="#b42318" font-size="11" font-weight="700">⚠ Enter a 10-digit phone number</text><text x="16" y="341" fill="#5b6b7d" font-size="11">Digits only.</text>
  <text x="16" y="368" font-weight="700">City</text><rect x="16" y="376" width="328" height="40" rx="6" fill="#fff" stroke="#14263f"/><rect x="13" y="373" width="334" height="46" rx="9" fill="none" stroke="#1d6fe0" stroke-width="2"/><text x="26" y="401.0" font-size="13">Sample City</text>
  <text x="16" y="440" font-weight="700">Postcode (optional)</text><rect x="16" y="448" width="328" height="40" rx="6" fill="#fff" stroke="#5b6b7d"/>
  <rect x="16" y="540" width="264" height="20" rx="10" fill="#fff" stroke="#14263f"/><text x="148.0" y="554" font-size="11" font-weight="700" text-anchor="middle">360 px · single column · no side scroll</text>
  <text x="16" y="590" fill="#5b6b7d" font-size="11">Status changes are announced; focus</text>
  <text x="16" y="606" fill="#5b6b7d" font-size="11">moves to the step heading on Next.</text>
  <rect x="16" y="640" width="156" height="44" rx="6" fill="#fff" stroke="#d5dee6"/><text x="94.0" y="667.0" font-size="14" font-weight="700" text-anchor="middle">‹ Back</text>
  <rect x="188" y="640" width="156" height="44" rx="6" fill="#0e9384"/><text x="266.0" y="667.0" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Next</text>
</svg>
