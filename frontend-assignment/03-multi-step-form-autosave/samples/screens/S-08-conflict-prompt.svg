<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" font-size="12" fill="#14263f" role="img" aria-labelledby="t d">
  <title id="t">Conflict prompt wireframe</title>
  <desc id="d">Sample wireframe: conflict prompt after a 409 on save, explaining the newer version and offering Reload latest or Keep mine, with autosave showing not saved. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="56" fill="#14263f"/>
  <text x="24" y="34" fill="#fff" font-size="15" font-weight="700">Sample application form (synthetic)</text>
  <rect x="552" y="15" width="224" height="26" rx="13" fill="#fff" stroke="#b42318"/><text x="664.0" y="33" fill="#b42318" font-weight="700" text-anchor="middle">⚠ Not saved: changed elsewhere</text>
  <circle cx="38" cy="88" r="13" fill="#0e9384" stroke="#0e9384" stroke-width="1.5"/>
  <text x="38" y="93" fill="#fff" font-weight="700" text-anchor="middle">✓</text>
  <text x="58" y="93" fill="#5b6b7d">Personal</text>
  <rect x="180" y="87" width="26" height="2" fill="#0e9384"/>
  <circle cx="228" cy="88" r="13" fill="#0e9384" stroke="#0e9384" stroke-width="1.5"/>
  <text x="228" y="93" fill="#fff" font-weight="700" text-anchor="middle">2</text>
  <text x="248" y="93" font-weight="700">Contact (current)</text>
  <rect x="370" y="87" width="26" height="2" fill="#d5dee6"/>
  <circle cx="418" cy="88" r="13" fill="#fff" stroke="#5b6b7d" stroke-width="1.5"/>
  <text x="418" y="93" fill="#5b6b7d" font-weight="700" text-anchor="middle">3</text>
  <text x="438" y="93" fill="#5b6b7d">Details</text>
  <rect x="560" y="87" width="26" height="2" fill="#d5dee6"/>
  <circle cx="608" cy="88" r="13" fill="#fff" stroke="#5b6b7d" stroke-width="1.5"/>
  <text x="608" y="93" fill="#5b6b7d" font-weight="700" text-anchor="middle">4</text>
  <text x="628" y="93" fill="#5b6b7d">Review</text>
  <rect x="24" y="116" width="752" height="304" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="48" y="148" font-size="18" font-weight="700">Step 2 of 4 · Contact</text>
  <rect x="24" y="434" width="100" height="32" rx="6" fill="#fff" stroke="#d5dee6"/><text x="74.0" y="455.0" font-size="13" font-weight="700" text-anchor="middle">‹ Back</text>
  <rect x="640" y="434" width="136" height="32" rx="6" fill="#0e9384"/><text x="708.0" y="455.0" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Next</text>
  <text x="48" y="186" font-weight="700">Email</text><rect x="48" y="194" width="330" height="32" rx="6" fill="#fff" stroke="#5b6b7d"/><text x="58" y="215.0" font-size="13">sam@example.test</text>
  <text x="400" y="186" font-weight="700">Phone</text><rect x="400" y="194" width="330" height="32" rx="6" fill="#fff" stroke="#5b6b7d"/><text x="410" y="215.0" font-size="13">9876543210</text>
  <rect x="0" y="56" width="800" height="424" fill="#14263f" opacity="0.5"/>
  <rect x="180" y="120" width="440" height="250" rx="10" fill="#fff" stroke="#d5dee6"/>
  <text x="204" y="156" font-size="17" font-weight="700">This draft changed in another tab</text>
  <text x="204" y="182" fill="#5b6b7d">Another tab saved newer answers at 10:44 (sample).</text>
  <text x="204" y="200" fill="#5b6b7d">Your edits here are not saved yet. Choose one:</text>
  <rect x="204" y="216" width="392" height="56" rx="6" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="220" y="238" font-size="13" font-weight="700">Reload latest</text>
  <text x="220" y="258" fill="#5b6b7d" font-size="11">Use the newer saved answers. Your edits here are lost.</text>
  <rect x="204" y="280" width="392" height="40" rx="6" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="220" y="305" font-size="13" font-weight="700">Keep mine · overwrite the newer version</text>
  <rect x="204" y="328" width="140" height="32" rx="6" fill="#0e9384"/><text x="274.0" y="349.0" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Reload latest</text>
  <rect x="201" y="325" width="146" height="38" rx="9" fill="none" stroke="#1d6fe0" stroke-width="2"/>
  <rect x="356" y="328" width="120" height="32" rx="6" fill="#fff" stroke="#d5dee6"/><text x="416.0" y="349.0" font-size="13" font-weight="700" text-anchor="middle">Keep mine</text>
  <rect x="500" y="334" width="73" height="20" rx="10" fill="#fff" stroke="#b42318"/><text x="536.5" y="348" fill="#b42318" font-size="11" font-weight="700" text-anchor="middle">Error 409</text>
</svg>
