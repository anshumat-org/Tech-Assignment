<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" font-size="12" fill="#14263f" role="img" aria-labelledby="t d">
  <title id="t">Error panel wireframe</title>
  <desc id="d">Sample wireframe: records page with the error panel highlighted after a server error, keeping the query and offering Retry with the same query. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="28" fill="#eef3f7"/>
  <rect x="12" y="5" width="776" height="18" rx="9" fill="#fff" stroke="#d5dee6"/>
  <text x="24" y="18" fill="#5b6b7d" font-size="11">localhost/records?q=&amp;status=active,pending&amp;sort=-updated&amp;page=1</text>
  <rect x="0" y="28" width="800" height="44" fill="#14263f"/>
  <text x="24" y="56" fill="#fff" font-size="16" font-weight="700">Records (sample data)</text>
  <text x="24" y="92" font-weight="700">Search records</text><rect x="24" y="100" width="250" height="32" rx="6" fill="#fff" stroke="#5b6b7d"/><text x="34" y="121.0" fill="#5b6b7d" font-size="13">Name, ID or owner…</text>
  <text x="290" y="92" font-weight="700">Status (multi-select)</text><rect x="290" y="100" width="170" height="32" rx="6" fill="#fff" stroke="#5b6b7d"/><text x="300" y="121.0" font-size="13">Active, Pending</text>
  <text x="444" y="121" font-size="13">▾</text>
  <text x="476" y="92" font-weight="700">Category</text><rect x="476" y="100" width="140" height="32" rx="6" fill="#fff" stroke="#5b6b7d"/><text x="486" y="121.0" font-size="13">Any</text>
  <text x="600" y="121" font-size="13">▾</text>
  <rect x="632" y="100" width="144" height="32" rx="6" fill="#fff" stroke="#d5dee6"/><text x="704.0" y="121.0" font-size="13" font-weight="700" text-anchor="middle">Clear filters</text>
  <text x="24" y="162" font-size="13" font-weight="700">Results not loaded</text>
  <rect x="560" y="436" width="90" height="32" rx="6" fill="#eef3f7" stroke="#d5dee6"/><text x="605.0" y="457.0" fill="#5b6b7d" font-size="13" font-weight="700" text-anchor="middle">‹ Previous</text>
  <rect x="660" y="436" width="116" height="32" rx="6" fill="#eef3f7" stroke="#d5dee6"/><text x="718.0" y="457.0" fill="#5b6b7d" font-size="13" font-weight="700" text-anchor="middle">Next ›</text>
  <rect x="24" y="172" width="752" height="252" rx="8" fill="#fff" stroke="#b42318" stroke-width="1.5"/>
  <rect x="24" y="172" width="6" height="252" rx="3" fill="#b42318"/>
  <text x="400" y="248" fill="#b42318" font-size="17" font-weight="700" text-anchor="middle">⚠ Could not load records</text>
  <text x="400" y="274" fill="#5b6b7d" text-anchor="middle">The server returned an error (500). Your search and filters are kept.</text>
  <rect x="340" y="296" width="120" height="32" rx="6" fill="#0e9384"/><text x="400.0" y="317.0" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Retry</text>
  <rect x="337" y="293" width="126" height="38" rx="9" fill="none" stroke="#1d6fe0" stroke-width="2"/>
  <text x="400" y="356" fill="#5b6b7d" font-size="11" text-anchor="middle">Retry repeats the same query.</text>
  <rect x="18" y="166" width="764" height="264" rx="10" fill="none" stroke="#0e9384" stroke-width="2" stroke-dasharray="6 4"/><rect x="600" y="143" width="130" height="20" rx="4" fill="#0e9384"/><text x="665.0" y="157" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">S-07 · Error panel</text>
  <rect x="180" y="146" width="105" height="20" rx="10" fill="#fff" stroke="#b42318"/><text x="232.5" y="160" fill="#b42318" font-size="11" font-weight="700" text-anchor="middle">✕ State: error</text>
  <rect x="290" y="146" width="111" height="20" rx="10" fill="#fff" stroke="#5b6b7d"/><text x="345.5" y="160" fill="#5b6b7d" font-size="11" font-weight="700" text-anchor="middle">Next: retrying…</text>
</svg>
