  <text x="290" y="92" font-weight="700">Status (multi-select)</text><rect x="290" y="100" width="170" height="32" rx="6" fill="#fff" stroke="#5b6b7d"/><text x="300" y="121.0" font-size="13">Archived</text>
  <text x="444" y="121" font-size="13">▾</text>
  <text x="476" y="92" font-weight="700">Category</text><rect x="476" y="100" width="140" height="32" rx="6" fill="#fff" stroke="#5b6b7d"/><text x="486" y="121.0" font-size="13">Any</text>
  <text x="600" y="121" font-size="13">▾</text>
  <rect x="632" y="100" width="144" height="32" rx="6" fill="#fff" stroke="#d5dee6"/><text x="704.0" y="121.0" font-size="13" font-weight="700" text-anchor="middle">Clear filters</text>
  <text x="24" y="162" font-size="13" font-weight="700">0 records</text>
  <text x="24" y="452" fill="#5b6b7d">Page 0 of 0</text>
  <rect x="560" y="436" width="90" height="32" rx="6" fill="#eef3f7" stroke="#d5dee6"/><text x="605.0" y="457.0" fill="#5b6b7d" font-size="13" font-weight="700" text-anchor="middle">‹ Previous</text>
  <rect x="660" y="436" width="116" height="32" rx="6" fill="#eef3f7" stroke="#d5dee6"/><text x="718.0" y="457.0" fill="#5b6b7d" font-size="13" font-weight="700" text-anchor="middle">Next ›</text>
  <rect x="24" y="172" width="752" height="252" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
