  <text x="400" y="240" fill="#5b6b7d" font-size="20" font-weight="700" text-anchor="middle">∅</text>
  <text x="400" y="290" font-size="15" font-weight="700" text-anchor="middle">No records match “zzqx” with Status: Archived</text>
  <text x="400" y="312" fill="#5b6b7d" text-anchor="middle">Try a shorter search or remove a filter.</text>
  <rect x="330" y="330" width="140" height="32" rx="6" fill="#0e9384"/><text x="400.0" y="351.0" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Clear filters</text>
