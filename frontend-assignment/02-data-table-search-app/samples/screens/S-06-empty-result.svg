<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" font-size="12" fill="#14263f" role="img" aria-labelledby="t d">
  <title id="t">Empty result wireframe</title>
  <desc id="d">Sample wireframe: records page with the empty result panel highlighted, a message naming the query and filter, and a Clear filters action. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="28" fill="#eef3f7"/>
  <rect x="12" y="5" width="776" height="18" rx="9" fill="#fff" stroke="#d5dee6"/>
  <text x="24" y="18" fill="#5b6b7d" font-size="11">localhost/records?q=zzqx&amp;status=archived</text>
  <rect x="0" y="28" width="800" height="44" fill="#14263f"/>
  <text x="24" y="56" fill="#fff" font-size="16" font-weight="700">Records (sample data)</text>
