<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Service health endpoint</title>
  <desc id="d">Sample JSON response panel for a service health endpoint with placeholder values. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Health endpoint</text>
  <rect x="24" y="76" width="752" height="44" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="104" font-size="13" fill="#14263f" font-family="ui-monospace, Menlo, monospace">GET /(health path placeholder)</text>
  <text x="760" y="104" font-size="12" fill="#1a7f4b" font-weight="700" text-anchor="end">200 OK</text>
  <rect x="24" y="132" width="752" height="150" rx="8" fill="#14263f"/>
  <text x="40" y="162" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">{</text>
  <text x="40" y="184" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">  "status": "ok",</text>
  <text x="40" y="206" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">  "checks": { "dependency": "ok" },</text>
  <text x="40" y="228" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">  "time": "(placeholder)"</text>
  <text x="40" y="250" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">}</text>
  <text x="24" y="340" font-size="12" fill="#5b6b7d">Other states: unhealthy (non-2xx) · unreachable (no response)</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
