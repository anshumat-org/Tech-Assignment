<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Scan report</title>
  <desc id="d">Sample security scan summary with findings by severity, a blocking threshold label and a release verdict. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Scan report · image (placeholder)</text>
  <text x="776" y="35" font-size="12" fill="#c9d6e3" text-anchor="end">Threshold: (placeholder)</text>
  <rect x="24" y="76" width="176" height="72" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="104" font-size="13" fill="#b42318" font-weight="700">Critical</text>
  <text x="40" y="134" font-size="16" fill="#14263f" font-weight="700">N (placeholder)</text>
  <rect x="214" y="76" width="176" height="72" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="230" y="104" font-size="13" fill="#b42318" font-weight="700">High</text>
  <text x="230" y="134" font-size="16" fill="#14263f" font-weight="700">N (placeholder)</text>
  <rect x="404" y="76" width="176" height="72" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="420" y="104" font-size="13" fill="#b26a00" font-weight="700">Medium</text>
  <text x="420" y="134" font-size="16" fill="#14263f" font-weight="700">N (placeholder)</text>
  <rect x="594" y="76" width="176" height="72" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="610" y="104" font-size="13" fill="#5b6b7d" font-weight="700">Low</text>
  <text x="610" y="134" font-size="16" fill="#14263f" font-weight="700">N (placeholder)</text>
  <rect x="24" y="168" width="752" height="38" rx="6" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="190" font-size="12" fill="#5b6b7d" font-weight="700">Severity</text>
  <text x="164" y="190" font-size="12" fill="#5b6b7d" font-weight="700">Package or file</text>
  <text x="444" y="190" font-size="12" fill="#5b6b7d" font-weight="700">Blocks release?</text>
  <rect x="24" y="212" width="752" height="38" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="234" font-size="13" fill="#14263f">High</text>
  <text x="164" y="234" font-size="13" fill="#14263f">package-a (placeholder)</text>
  <text x="444" y="234" font-size="12" fill="#b42318" font-weight="700">⊘ blocked</text>
  <rect x="24" y="256" width="752" height="38" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="278" font-size="13" fill="#14263f">Medium</text>
  <text x="164" y="278" font-size="13" fill="#14263f">package-b (placeholder)</text>
  <text x="444" y="278" font-size="12" fill="#b26a00" font-weight="700">! warning</text>
  <rect x="24" y="300" width="752" height="38" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="322" font-size="13" fill="#14263f">Low</text>
  <text x="164" y="322" font-size="13" fill="#14263f">file-c (placeholder)</text>
  <text x="444" y="322" font-size="12" fill="#1a7f4b" font-weight="700">✓ passed</text>
  <rect x="24" y="360" width="752" height="50" rx="8" fill="#fff" stroke="#b42318" stroke-width="2"/>
  <text x="44" y="391" font-size="14" fill="#b42318" font-weight="700">⊘ Blocked — findings at or above threshold (placeholder rule)</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
