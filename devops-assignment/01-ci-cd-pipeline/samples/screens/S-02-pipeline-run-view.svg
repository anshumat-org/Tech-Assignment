  <rect x="332" y="116" width="136" height="72" rx="8" fill="#fff" stroke="#1a7f4b" stroke-width="2"/>
  <text x="344" y="142" font-size="13" fill="#14263f" font-weight="700">Scan</text>
  <text x="344" y="168" font-size="11" fill="#1a7f4b" font-weight="700">✓ passed</text>
  <path d="M470 152 H482 M478 147 L483 152 L478 157" fill="none" stroke="#5b6b7d" stroke-width="2"/>
