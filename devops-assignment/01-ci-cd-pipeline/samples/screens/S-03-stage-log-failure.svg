<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stage log with failure</title>
  <desc id="d">Sample stage log showing step output, a failing test name and the error cause line. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Run #(placeholder) › Test</text>
  <text x="776" y="35" font-size="12" fill="#c9d6e3" text-anchor="end">✗ failed</text>
  <rect x="24" y="76" width="752" height="300" rx="8" fill="#14263f"/>
  <text x="40" y="98" font-size="11" fill="#9fb0c4">Step output · Test</text>
  <text x="40" y="124" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (test command placeholder)</text>
  <text x="40" y="146" font-size="13" fill="#9fb0c4" font-family="ui-monospace, Menlo, monospace">Running 42 tests (placeholder)</text>
  <text x="40" y="168" font-size="13" fill="#4cc38a" font-family="ui-monospace, Menlo, monospace">  ✓ test_placeholder_one</text>
  <text x="40" y="190" font-size="13" fill="#4cc38a" font-family="ui-monospace, Menlo, monospace">  ✓ test_placeholder_two</text>
  <text x="40" y="212" font-size="13" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace">  ✗ test_placeholder_three</text>
  <text x="40" y="234" font-size="13" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace">    Error: expected (placeholder), got (placeholder)</text>
  <text x="40" y="256" font-size="13" fill="#9fb0c4" font-family="ui-monospace, Menlo, monospace">    at (file placeholder):line N</text>
  <text x="40" y="278" font-size="13" fill="#f0b35a" font-family="ui-monospace, Menlo, monospace">Summary: 41 passed, 1 failed (placeholder)</text>
  <text x="40" y="300" font-size="13" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace">Step exited with code 1</text>
  <text x="24" y="410" font-size="12" fill="#5b6b7d">Failing test and cause are visible without scrolling.</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
