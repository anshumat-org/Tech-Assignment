<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PR checks panel</title>
  <desc id="d">Sample generic code-host pull request panel listing one check per pipeline stage with status, commit SHA and log links. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Code host (generic)</text>
  <text x="776" y="35" font-size="12" fill="#c9d6e3" text-anchor="end">PR #(placeholder) · branch feature/(placeholder)</text>
  <text x="24" y="90" font-size="18" fill="#14263f" font-weight="700">Add (placeholder) feature</text>
  <text x="24" y="112" font-size="12" fill="#5b6b7d">Commit abc1234 (placeholder) · 3 checks</text>
  <rect x="24" y="130" width="752" height="40" rx="6" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="152" font-size="12" fill="#5b6b7d" font-weight="700">Check</text>
  <text x="324" y="152" font-size="12" fill="#5b6b7d" font-weight="700">Status</text>
  <text x="524" y="152" font-size="12" fill="#5b6b7d" font-weight="700">Details</text>
  <rect x="24" y="176" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="198" font-size="13" fill="#14263f">build</text>
  <text x="324" y="198" font-size="12" fill="#1a7f4b" font-weight="700">✓ passed</text>
  <text x="524" y="198" font-size="13" fill="#14263f">View run logs →</text>
  <rect x="24" y="222" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="244" font-size="13" fill="#14263f">test</text>
  <text x="324" y="244" font-size="12" fill="#0e9384" font-weight="700">● running</text>
  <text x="524" y="244" font-size="13" fill="#14263f">View run logs →</text>
  <rect x="24" y="268" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="290" font-size="13" fill="#14263f">scan</text>
  <text x="324" y="290" font-size="12" fill="#5b6b7d" font-weight="700">○ queued</text>
  <text x="524" y="290" font-size="13" fill="#14263f">View run logs →</text>
  <rect x="24" y="330" width="752" height="56" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="44" y="363" font-size="14" fill="#b26a00" font-weight="700">⏸ Merge blocked until all required checks pass</text>
  <rect x="616" y="340" width="140" height="36" rx="8" fill="#fff" stroke="#5b6b7d"/>
  <text x="686.0" y="363" font-size="14" fill="#5b6b7d" text-anchor="middle">Merge (disabled)</text>
  <text x="24" y="420" font-size="12" fill="#5b6b7d">Status uses icon + text, not colour alone.</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
