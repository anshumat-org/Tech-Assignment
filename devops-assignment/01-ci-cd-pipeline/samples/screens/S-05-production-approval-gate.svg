<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Production approval gate</title>
  <desc id="d">Sample generic code-host deployment approval panel with image digest, staging smoke result and approve or reject actions. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Code host (generic)</text>
  <text x="776" y="35" font-size="12" fill="#c9d6e3" text-anchor="end">PR #(placeholder) · branch feature/(placeholder)</text>
  <text x="24" y="92" font-size="18" fill="#b26a00" font-weight="700">Deploy to production — awaiting approval</text>
  <rect x="24" y="110" width="752" height="170" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="44" y="142" font-size="13" fill="#5b6b7d" font-weight="700">Image</text>
  <text x="200" y="142" font-size="13" fill="#14263f" font-family="ui-monospace, Menlo, monospace">service:(placeholder)</text>
  <text x="44" y="176" font-size="13" fill="#5b6b7d" font-weight="700">Digest</text>
  <text x="200" y="176" font-size="13" fill="#14263f" font-family="ui-monospace, Menlo, monospace">sha256:(placeholder)</text>
  <text x="44" y="210" font-size="13" fill="#5b6b7d" font-weight="700">Commit</text>
  <text x="200" y="210" font-size="13" fill="#14263f" font-family="ui-monospace, Menlo, monospace">abc1234 (placeholder)</text>
  <text x="44" y="244" font-size="13" fill="#5b6b7d" font-weight="700">Staging smoke</text>
  <text x="200" y="244" font-size="13" fill="#14263f" font-family="ui-monospace, Menlo, monospace"></text>
  <text x="200" y="244" font-size="13" fill="#1a7f4b" font-weight="700">✓ passed</text>
  <text x="24" y="312" font-size="13" fill="#14263f">Approver: (name placeholder) · required reviewers: 1</text>
  <rect x="24" y="330" width="140" height="36" rx="8" fill="#1a7f4b"/>
  <text x="94.0" y="353" font-size="14" fill="#fff" text-anchor="middle">Approve</text>
  <rect x="176" y="330" width="140" height="36" rx="8" fill="#fff" stroke="#b42318"/>
  <text x="246.0" y="353" font-size="14" fill="#b42318" text-anchor="middle">Reject</text>
  <text x="24" y="400" font-size="12" fill="#5b6b7d">Other states: approved · rejected</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
