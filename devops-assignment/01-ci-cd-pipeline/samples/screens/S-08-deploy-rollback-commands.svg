<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Deploy and rollback commands</title>
  <desc id="d">Sample terminal showing placeholder deploy and rollback commands with target, SHA, output and elapsed time. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Deploy / rollback · production</text>
  <rect x="24" y="76" width="752" height="300" rx="8" fill="#14263f"/>
  <text x="40" y="98" font-size="11" fill="#9fb0c4">Terminal</text>
  <text x="40" y="124" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (deploy command placeholder) --env prod --sha abc1234</text>
  <text x="40" y="146" font-size="13" fill="#9fb0c4" font-family="ui-monospace, Menlo, monospace">Deploying abc1234 (placeholder) … </text>
  <text x="40" y="168" font-size="13" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace">Smoke test: failed (placeholder)</text>
  <text x="40" y="212" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (rollback command placeholder) --env prod</text>
  <text x="40" y="234" font-size="13" fill="#9fb0c4" font-family="ui-monospace, Menlo, monospace">Rolling back to previous SHA 9f8e7d6 (placeholder)</text>
  <text x="40" y="256" font-size="13" fill="#4cc38a" font-family="ui-monospace, Menlo, monospace">Health: healthy · version 9f8e7d6 (placeholder)</text>
  <text x="40" y="278" font-size="13" fill="#4cc38a" font-family="ui-monospace, Menlo, monospace">Rollback succeeded · elapsed Ns (placeholder)</text>
  <text x="24" y="410" font-size="12" fill="#5b6b7d">Command names are the candidate's choice — these are placeholders.</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
