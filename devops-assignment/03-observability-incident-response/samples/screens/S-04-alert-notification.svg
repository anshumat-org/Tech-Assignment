<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Alert notification card</title>
  <desc id="d">Sample generic chat message card for a firing alert and its resolved follow-up, with severity, owner, summary and runbook link. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">#on-call (generic chat receiver)</text>
  <rect x="24" y="80" width="752" height="170" rx="8" fill="#fff" stroke="#d5dee6"/>
  <rect x="24" y="80" width="6" height="170" fill="#b42318"/>
  <text x="46" y="110" font-size="15" fill="#14263f" font-weight="700">[FIRING] AlertName-A (placeholder)</text>
  <text x="640" y="110" font-size="13" fill="#b42318" font-weight="700">▲ firing</text>
  <text x="46" y="140" font-size="13" fill="#5b6b7d">Severity: page · Owner: (team placeholder)</text>
  <text x="46" y="168" font-size="13" fill="#14263f">Users see errors on (placeholder) — reason (placeholder)</text>
  <text x="46" y="196" font-size="13" fill="#0e9384">Runbook: (link placeholder) →</text>
  <text x="46" y="228" font-size="13" fill="#0e9384">Dashboard: (link placeholder) →</text>
  <rect x="24" y="266" width="752" height="170" rx="8" fill="#fff" stroke="#d5dee6"/>
  <rect x="24" y="266" width="6" height="170" fill="#1a7f4b"/>
  <text x="46" y="296" font-size="15" fill="#14263f" font-weight="700">[RESOLVED] AlertName-A (placeholder)</text>
  <text x="640" y="296" font-size="13" fill="#1a7f4b" font-weight="700">✓ resolved</text>
  <text x="46" y="326" font-size="13" fill="#5b6b7d">Severity: page · Owner: (team placeholder)</text>
  <text x="46" y="354" font-size="13" fill="#14263f">Resolved after N min (placeholder)</text>
  <text x="46" y="382" font-size="13" fill="#0e9384">Runbook: (link placeholder) →</text>
  <text x="46" y="414" font-size="13" fill="#0e9384">Dashboard: (link placeholder) →</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
