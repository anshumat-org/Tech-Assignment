<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Failure injection toggle</title>
  <desc id="d">Sample terminal toggling a placeholder failure type on and off with its stated trigger method. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Failure injection</text>
  <rect x="24" y="76" width="752" height="260" rx="8" fill="#14263f"/>
  <text x="40" y="98" font-size="11" fill="#9fb0c4">Terminal</text>
  <text x="40" y="124" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (inject command placeholder) --type (failure type) --on</text>
  <text x="40" y="146" font-size="13" fill="#f0b35a" font-family="ui-monospace, Menlo, monospace">Injected: (failure type placeholder) · trigger: (method)</text>
  <text x="40" y="190" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (inject command placeholder) --type (failure type) --off</text>
  <text x="40" y="212" font-size="13" fill="#4cc38a" font-family="ui-monospace, Menlo, monospace">Cleared (placeholder)</text>
  <text x="24" y="370" font-size="12" fill="#5b6b7d">States: off · injected · cleared</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
