<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Config check and reload</title>
  <desc id="d">Sample terminal validating rule and dashboard files, showing a summarised diff and reload result without rule content. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Config check and reload</text>
  <rect x="24" y="76" width="752" height="280" rx="8" fill="#14263f"/>
  <text x="40" y="98" font-size="11" fill="#9fb0c4">Terminal</text>
  <text x="40" y="124" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (rule check command placeholder) (rules file)</text>
  <text x="40" y="146" font-size="13" fill="#9fb0c4" font-family="ui-monospace, Menlo, monospace">Checking (rules file placeholder)</text>
  <text x="40" y="168" font-size="13" fill="#4cc38a" font-family="ui-monospace, Menlo, monospace">  SUCCESS: N rules found (placeholder)</text>
  <text x="40" y="190" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">Diff: N rules changed, N added (placeholder)</text>
  <text x="40" y="212" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (reload command placeholder)</text>
  <text x="40" y="234" font-size="13" fill="#4cc38a" font-family="ui-monospace, Menlo, monospace">Reloaded · config version (placeholder)</text>
  <text x="24" y="390" font-size="12" fill="#5b6b7d">States: valid · invalid · reloaded. Rule content intentionally not shown.</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
