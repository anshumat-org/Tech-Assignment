<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Secrets manager entries</title>
  <desc id="d">Sample secrets manager list showing secret names, versions and status; values are never shown. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Secrets manager (real or simulated)</text>
  <rect x="24" y="76" width="752" height="40" rx="6" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="98" font-size="12" fill="#5b6b7d" font-weight="700">Name</text>
  <text x="264" y="98" font-size="12" fill="#5b6b7d" font-weight="700">Version</text>
  <text x="384" y="98" font-size="12" fill="#5b6b7d" font-weight="700">Read by</text>
  <text x="584" y="98" font-size="12" fill="#5b6b7d" font-weight="700">State</text>
  <rect x="24" y="122" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="144" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">app/db-password</text>
  <text x="264" y="144" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">v(N)</text>
  <text x="384" y="144" font-size="13" fill="#14263f">workload (placeholder)</text>
  <text x="584" y="144" font-size="12" fill="#0e9384" font-weight="700">↻ rotated</text>
  <rect x="24" y="168" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="190" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">app/api-token</text>
  <text x="264" y="190" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">v(N)</text>
  <text x="384" y="190" font-size="13" fill="#14263f">workload (placeholder)</text>
  <text x="584" y="190" font-size="12" fill="#1a7f4b" font-weight="700">✓ present</text>
  <rect x="24" y="214" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="236" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">app/old-key</text>
  <text x="264" y="236" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">v(N)</text>
  <text x="384" y="236" font-size="13" fill="#14263f">—</text>
  <text x="584" y="236" font-size="12" fill="#b42318" font-weight="700">⊘ revoked</text>
  <rect x="24" y="280" width="752" height="60" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="44" y="316" font-size="13" fill="#5b6b7d" font-family="ui-monospace, Menlo, monospace">Value: •••••••• (never displayed)</text>
  <rect x="520" y="292" width="110" height="36" rx="8" fill="#fff" stroke="#0e9384"/>
  <text x="575.0" y="315" font-size="14" fill="#0e9384" text-anchor="middle">Rotate</text>
  <rect x="646" y="292" width="110" height="36" rx="8" fill="#fff" stroke="#b42318"/>
  <text x="701.0" y="315" font-size="14" fill="#b42318" text-anchor="middle">Revoke</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
