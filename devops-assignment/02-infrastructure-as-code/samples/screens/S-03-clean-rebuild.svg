<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Clean rebuild sequence</title>
  <desc id="d">Sample terminal showing an ordered init, plan and apply sequence from a clean checkout with placeholder commands. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Clean rebuild · dev (from clean checkout)</text>
  <rect x="24" y="76" width="752" height="320" rx="8" fill="#14263f"/>
  <text x="40" y="98" font-size="11" fill="#9fb0c4">Terminal</text>
  <text x="40" y="124" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ git clone (repo placeholder) &amp;&amp; cd (repo)</text>
  <text x="40" y="146" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (init command placeholder)</text>
  <text x="40" y="168" font-size="13" fill="#4cc38a" font-family="ui-monospace, Menlo, monospace">Backend initialised (placeholder)</text>
  <text x="40" y="190" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (plan command placeholder) -env dev</text>
  <text x="40" y="212" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">Plan: N to add, 0 to change, 0 to destroy (placeholder)</text>
  <text x="40" y="234" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (apply command placeholder) -env dev</text>
  <text x="40" y="256" font-size="13" fill="#4cc38a" font-family="ui-monospace, Menlo, monospace">Apply complete · total elapsed N min (placeholder)</text>
  <text x="40" y="300" font-size="13" fill="#9fb0c4" font-family="ui-monospace, Menlo, monospace">Wrapper script or Makefile: candidate decides</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
