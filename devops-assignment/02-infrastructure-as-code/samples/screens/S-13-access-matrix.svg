<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Access matrix</title>
  <desc id="d">Sample access matrix table listing identities, purpose, permission scope, environment and wildcard reasons with placeholder values. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Access matrix</text>
  <text x="776" y="35" font-size="12" fill="#c9d6e3" text-anchor="end">draft</text>
  <rect x="24" y="76" width="752" height="40" rx="6" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="98" font-size="12" fill="#5b6b7d" font-weight="700">Identity</text>
  <text x="194" y="98" font-size="12" fill="#5b6b7d" font-weight="700">Purpose</text>
  <text x="354" y="98" font-size="12" fill="#5b6b7d" font-weight="700">Permissions</text>
  <text x="544" y="98" font-size="12" fill="#5b6b7d" font-weight="700">Env</text>
  <text x="624" y="98" font-size="12" fill="#5b6b7d" font-weight="700">Wildcard reason</text>
  <rect x="24" y="122" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="144" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">ci-pipeline</text>
  <text x="194" y="144" font-size="13" fill="#14263f">(placeholder)</text>
  <text x="354" y="144" font-size="13" fill="#14263f">(scope placeholder)</text>
  <text x="544" y="144" font-size="13" fill="#14263f">all</text>
  <text x="624" y="144" font-size="13" fill="#14263f">—</text>
  <rect x="24" y="168" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="190" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">workload</text>
  <text x="194" y="190" font-size="13" fill="#14263f">(placeholder)</text>
  <text x="354" y="190" font-size="13" fill="#14263f">(scope placeholder)</text>
  <text x="544" y="190" font-size="13" fill="#14263f">prod</text>
  <text x="624" y="190" font-size="13" fill="#14263f">—</text>
  <rect x="24" y="214" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="236" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">operator</text>
  <text x="194" y="236" font-size="13" fill="#14263f">(placeholder)</text>
  <text x="354" y="236" font-size="13" fill="#14263f">(scope placeholder)</text>
  <text x="544" y="236" font-size="13" fill="#14263f">prod</text>
  <text x="624" y="236" font-size="13" fill="#14263f">(reason)</text>
  <rect x="24" y="260" width="752" height="40" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="282" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">approver</text>
  <text x="194" y="282" font-size="13" fill="#14263f">(placeholder)</text>
  <text x="354" y="282" font-size="13" fill="#14263f">(scope placeholder)</text>
  <text x="544" y="282" font-size="13" fill="#14263f">prod</text>
  <text x="624" y="282" font-size="13" fill="#14263f">—</text>
  <text x="24" y="330" font-size="12" fill="#5b6b7d">Least privilege: every wildcard needs a written reason.</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
