<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Plan review on pull request</title>
  <desc id="d">Sample generic code-host pull request with plan summaries per environment attached as a comment and a reviewer note. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Code host (generic)</text>
  <text x="776" y="35" font-size="12" fill="#c9d6e3" text-anchor="end">PR #(placeholder) · infra change</text>
  <text x="24" y="90" font-size="18" fill="#14263f" font-weight="700">Change instance size (placeholder)</text>
  <rect x="24" y="106" width="752" height="160" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="44" y="132" font-size="13" fill="#5b6b7d" font-weight="700">Bot comment · plan output</text>
  <text x="44" y="164" font-size="13" fill="#14263f" font-weight="700">dev</text>
  <text x="130" y="164" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">Plan: N to add, N to change, 0 to destroy (placeholder)</text>
  <text x="650" y="164" font-size="12" fill="#1a7f4b" font-weight="700">✓ passed</text>
  <text x="44" y="194" font-size="13" fill="#14263f" font-weight="700">staging</text>
  <text x="130" y="194" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">Plan: N to add, N to change, 0 to destroy (placeholder)</text>
  <text x="650" y="194" font-size="12" fill="#1a7f4b" font-weight="700">✓ passed</text>
  <text x="44" y="224" font-size="13" fill="#14263f" font-weight="700">prod</text>
  <text x="130" y="224" font-size="12" fill="#14263f" font-family="ui-monospace, Menlo, monospace">Plan: 0 to add, N to change, 0 to destroy (placeholder)</text>
  <text x="650" y="224" font-size="12" fill="#b26a00" font-weight="700">◐ pending</text>
  <rect x="24" y="282" width="752" height="70" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="44" y="308" font-size="13" fill="#14263f" font-weight="700">Reviewer (placeholder)</text>
  <text x="44" y="332" font-size="13" fill="#5b6b7d">Comment text (placeholder) — why does prod change N resources?</text>
  <text x="24" y="384" font-size="13" fill="#b26a00" font-weight="700">⏸ awaiting approval</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
