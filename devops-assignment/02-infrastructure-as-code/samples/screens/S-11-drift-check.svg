<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Drift check output</title>
  <desc id="d">Sample terminal showing a placeholder drift check against live resources with a diff list. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Drift check · prod</text>
  <rect x="24" y="76" width="752" height="280" rx="8" fill="#14263f"/>
  <text x="40" y="98" font-size="11" fill="#9fb0c4">Terminal</text>
  <text x="40" y="124" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (drift check command placeholder) -env prod</text>
  <text x="40" y="146" font-size="13" fill="#9fb0c4" font-family="ui-monospace, Menlo, monospace">Comparing code with live resources…</text>
  <text x="40" y="168" font-size="13" fill="#f0b35a" font-family="ui-monospace, Menlo, monospace">  ~ resource_b.(placeholder)  attribute changed outside code</text>
  <text x="40" y="190" font-size="13" fill="#f0b35a" font-family="ui-monospace, Menlo, monospace">  ~ resource_d.(placeholder)  tag added in console</text>
  <text x="40" y="234" font-size="13" fill="#f0b35a" font-family="ui-monospace, Menlo, monospace">! Drift detected: N resources (placeholder)</text>
  <text x="24" y="390" font-size="12" fill="#5b6b7d">Other state: no drift</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
