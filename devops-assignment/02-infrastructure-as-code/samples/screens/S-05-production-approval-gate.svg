<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Production apply approval gate</title>
  <desc id="d">Sample generic code-host approval panel for a production apply with plan summary, destroy warning and approve or reject actions. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Code host (generic)</text>
  <text x="776" y="35" font-size="12" fill="#c9d6e3" text-anchor="end">PR #(placeholder) · infra change</text>
  <text x="24" y="92" font-size="18" fill="#b26a00" font-weight="700">Apply to production — awaiting approval</text>
  <rect x="24" y="110" width="752" height="130" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="44" y="140" font-size="13" fill="#5b6b7d" font-weight="700">Plan summary</text>
  <text x="200" y="140" font-size="13" fill="#14263f" font-family="ui-monospace, Menlo, monospace">N to add, N to change, 1 to destroy (placeholder)</text>
  <text x="44" y="172" font-size="13" fill="#5b6b7d" font-weight="700">Plan ref</text>
  <text x="200" y="172" font-size="13" fill="#14263f" font-family="ui-monospace, Menlo, monospace">(plan artefact placeholder)</text>
  <text x="44" y="204" font-size="13" fill="#5b6b7d" font-weight="700">Approver</text>
  <text x="200" y="204" font-size="13" fill="#14263f">(name placeholder)</text>
  <rect x="24" y="252" width="752" height="48" rx="8" fill="#fff" stroke="#b42318" stroke-width="2"/>
  <text x="44" y="282" font-size="14" fill="#b42318" font-weight="700">! Destroy warning: resource_c.(placeholder) will be destroyed</text>
  <rect x="24" y="320" width="140" height="36" rx="8" fill="#1a7f4b"/>
  <text x="94.0" y="343" font-size="14" fill="#fff" text-anchor="middle">Approve</text>
  <rect x="176" y="320" width="140" height="36" rx="8" fill="#fff" stroke="#b42318"/>
  <text x="246.0" y="343" font-size="14" fill="#b42318" text-anchor="middle">Reject</text>
  <text x="24" y="390" font-size="12" fill="#5b6b7d">Other states: approved · rejected</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
