<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Destroy safeguard</title>
  <desc id="d">Sample terminal showing a plan blocked because a protected resource would be destroyed, with a documented override note. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Destroy safeguard · prod</text>
  <rect x="24" y="76" width="752" height="260" rx="8" fill="#14263f"/>
  <text x="40" y="98" font-size="11" fill="#9fb0c4">Terminal</text>
  <text x="40" y="124" font-size="13" fill="#e8eef6" font-family="ui-monospace, Menlo, monospace">$ (plan command placeholder) -env prod</text>
  <text x="40" y="146" font-size="13" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace">  - data_store.(placeholder)   will be destroyed</text>
  <text x="40" y="190" font-size="13" fill="#ff7b72" font-family="ui-monospace, Menlo, monospace">✗ Blocked: resource is protected from destroy (placeholder)</text>
  <text x="40" y="212" font-size="13" fill="#f0b35a" font-family="ui-monospace, Menlo, monospace">Override requires documented reason + approver (placeholder)</text>
  <rect x="24" y="352" width="752" height="34" rx="6" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="374" font-size="12" fill="#5b6b7d" font-weight="700">State</text>
  <text x="204" y="374" font-size="12" fill="#5b6b7d" font-weight="700">Meaning</text>
  <rect x="24" y="392" width="752" height="34" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="414" font-size="12" fill="#b42318" font-weight="700">⊘ blocked</text>
  <text x="204" y="414" font-size="13" fill="#14263f">Destroy stopped by protection — change not applied</text>
  <text x="24" y="470" font-size="10" fill="#5b6b7d">Sample only · placeholder values · not a solution</text>
</svg>
