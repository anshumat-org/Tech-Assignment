<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Setup and launch commands</title>
  <desc id="d">Terminal building data and KPI views then starting the dashboard. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Setup and launch (CLI)</text>
  <rect x="722" y="14" width="54" height="28" rx="14" fill="#e7f5ee" stroke="#1a7f4b"/>
  <text x="749.0" y="33" font-size="12" fill="#1a7f4b" font-weight="700" text-anchor="middle">DONE</text>
  <rect x="24" y="76" width="752" height="270" rx="8" fill="#14263f"/>
  <circle cx="42" cy="92" r="5" fill="#b42318"/>
  <circle cx="58" cy="92" r="5" fill="#b26a00"/>
  <circle cx="74" cy="92" r="5" fill="#1a7f4b"/>
  <text x="42" y="124" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">$ &lt;setup command&gt;                 # placeholder</text>
  <text x="42" y="146" font-size="13" fill="#8fd6b4" font-family="Menlo, Consolas, monospace" xml:space="preserve">[1/3] generate or load data ........ done</text>
  <text x="42" y="168" font-size="13" fill="#8fd6b4" font-family="Menlo, Consolas, monospace" xml:space="preserve">[2/3] build KPI views .............. done</text>
  <text x="42" y="190" font-size="13" fill="#8fd6b4" font-family="Menlo, Consolas, monospace" xml:space="preserve">[3/3] start dashboard / export ..... done</text>
  <text x="42" y="212" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">dashboard at http://localhost:&lt;port&gt;</text>
  <text x="42" y="234" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">$ _</text>
  <text x="24" y="372" font-size="12" fill="#5b6b7d">States: running · done · error</text>
  <text x="24" y="466" font-size="11" fill="#5b6b7d">Sample layout · all names and values are placeholders · Illustrative only.</text>
</svg>
