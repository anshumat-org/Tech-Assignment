<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Dashboard header and filter</title>
  <desc id="d">Dashboard header with as-of date, source and filters plus a stale banner. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">KPI Dashboard (placeholder title)</text>
  <rect x="714" y="14" width="62" height="28" rx="14" fill="#fff4e0" stroke="#b26a00"/>
  <text x="745.0" y="33" font-size="12" fill="#b26a00" font-weight="700" text-anchor="middle">STALE</text>
  <rect x="0" y="56" width="800" height="52" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="24" y="78" font-size="12" fill="#5b6b7d">As of YYYY-MM-DD · Source: synthetic dataset (placeholder)</text>
  <text x="24" y="96" font-size="12" fill="#14263f" font-weight="700">Filter:</text>
  <rect x="72" y="84" width="150" height="18" rx="4" fill="#ffffff" stroke="#d5dee6"/>
  <text x="80" y="97" font-size="11" fill="#14263f">Date range ▾</text>
  <rect x="232" y="84" width="150" height="18" rx="4" fill="#ffffff" stroke="#d5dee6"/>
  <text x="240" y="97" font-size="11" fill="#14263f">Segment: All ▾</text>
  <rect x="24" y="124" width="752" height="34" rx="6" fill="#fff4e0" stroke="#b26a00"/>
  <text x="38" y="146" font-size="12" fill="#b26a00" font-weight="700">Stale:</text>
  <text x="91.6" y="146" font-size="12" fill="#14263f">data was rebuilt after the as-of date shown. Refresh the date before sharing.</text>
  <rect x="24" y="176" width="752" height="270" rx="8" fill="#ffffff" stroke="#d5dee6" stroke-dasharray="6 4"/>
  <text x="400" y="316" font-size="13" fill="#5b6b7d" text-anchor="middle">Tiles and charts below (see S-03, S-04)</text>
  <text x="24" y="466" font-size="11" fill="#5b6b7d">Sample layout · all names and values are placeholders · Illustrative only.</text>
</svg>
