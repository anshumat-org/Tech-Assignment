<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Setup and run commands</title>
  <desc id="d">Terminal running setup steps in order with the last step in error state. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Setup and run (CLI)</text>
  <rect x="714" y="14" width="62" height="28" rx="14" fill="#fdecea" stroke="#b42318"/>
  <text x="745.0" y="33" font-size="12" fill="#b42318" font-weight="700" text-anchor="middle">ERROR</text>
  <rect x="24" y="76" width="752" height="270" rx="8" fill="#14263f"/>
  <circle cx="42" cy="92" r="5" fill="#b42318"/>
  <circle cx="58" cy="92" r="5" fill="#b26a00"/>
  <circle cx="74" cy="92" r="5" fill="#1a7f4b"/>
  <text x="42" y="124" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">$ &lt;your setup command&gt;            # placeholder</text>
  <text x="42" y="146" font-size="13" fill="#8fd6b4" font-family="Menlo, Consolas, monospace" xml:space="preserve">[1/4] generate or load data ......... done</text>
  <text x="42" y="168" font-size="13" fill="#8fd6b4" font-family="Menlo, Consolas, monospace" xml:space="preserve">[2/4] create shared views ........... done</text>
  <text x="42" y="190" font-size="13" fill="#8fd6b4" font-family="Menlo, Consolas, monospace" xml:space="preserve">[3/4] run queries 1-5 ............... done</text>
  <text x="42" y="212" font-size="13" fill="#f4a39a" font-family="Menlo, Consolas, monospace" xml:space="preserve">[4/4] run checks .................... ERROR</text>
  <text x="42" y="234" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">      &lt;error message placeholder&gt;</text>
  <text x="42" y="256" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">      see &lt;log path placeholder&gt;</text>
  <text x="42" y="278" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">$ _</text>
  <rect x="24" y="366" width="752" height="34" rx="6" fill="#fdecea" stroke="#b42318"/>
  <text x="38" y="388" font-size="12" fill="#b42318" font-weight="700">Error:</text>
  <text x="91.6" y="388" font-size="12" fill="#14263f">step 4 failed. The README says what to check and how to rerun one step.</text>
  <text x="24" y="432" font-size="12" fill="#5b6b7d">States: not run · running · done · error</text>
  <text x="24" y="466" font-size="11" fill="#5b6b7d">Sample layout · all names and values are placeholders · Illustrative only.</text>
</svg>
