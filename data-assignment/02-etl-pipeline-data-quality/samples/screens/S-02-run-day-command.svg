<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Run day command</title>
  <desc id="d">Terminal loading one day with placeholder counts and a failed exit status. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" font-size="16" fill="#ffffff" font-weight="700">Run day (CLI)</text>
  <rect x="706" y="14" width="70" height="28" rx="14" fill="#fdecea" stroke="#b42318"/>
  <text x="741.0" y="33" font-size="12" fill="#b42318" font-weight="700" text-anchor="middle">FAILED</text>
  <rect x="24" y="76" width="752" height="256" rx="8" fill="#14263f"/>
  <circle cx="42" cy="92" r="5" fill="#b42318"/>
  <circle cx="58" cy="92" r="5" fill="#b26a00"/>
  <circle cx="74" cy="92" r="5" fill="#1a7f4b"/>
  <text x="42" y="124" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">$ &lt;run-day command&gt; --day YYYY-MM-DD</text>
  <text x="42" y="146" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">run_id    run-0000 (placeholder)</text>
  <text x="42" y="168" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">read      n     loaded  n     rejected  n</text>
  <text x="42" y="190" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">dq        blocking test failed: test_x (placeholder)</text>
  <text x="42" y="212" font-size="13" fill="#f4a39a" font-family="Menlo, Consolas, monospace" xml:space="preserve">status    FAILED   exit code 1</text>
  <text x="42" y="234" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">model tables left unchanged</text>
  <text x="42" y="256" font-size="13" fill="#e8eef6" font-family="Menlo, Consolas, monospace" xml:space="preserve">$ _</text>
  <rect x="24" y="350" width="752" height="34" rx="6" fill="#fdecea" stroke="#b42318"/>
  <text x="38" y="372" font-size="12" fill="#b42318" font-weight="700">Failed:</text>
  <text x="99.19999999999999" y="372" font-size="12" fill="#14263f">non-zero exit, run log row written, model untouched.</text>
  <text x="24" y="466" font-size="11" fill="#5b6b7d">Sample layout · all names and values are placeholders · Illustrative only.</text>
</svg>
