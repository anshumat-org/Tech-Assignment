  <rect x="674.5925925925926" y="118.0" width="47" height="18" rx="9" fill="#e7f5ee" stroke="#1a7f4b"/>
  <text x="698.0925925925926" y="131.0" font-size="10" fill="#1a7f4b" font-weight="700" text-anchor="middle">MATCH</text>
  <line x1="24" y1="144" x2="776" y2="144" stroke="#d5dee6"/>
  <text x="34" y="165.0" font-size="12" fill="#14263f">fact_orders</text>
