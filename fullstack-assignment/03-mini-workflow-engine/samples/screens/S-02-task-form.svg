<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Task form wireframe</title>
  <desc id="d">Sample wireframe: one reusable create or edit form with inline validation errors. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Tasks · New task</text>
  <rect x="616" y="70" width="160" height="22" rx="11" fill="#e8f0fe"/><text x="696" y="86" font-size="12" fill="#1d4fb0" text-anchor="middle">State: validation error</text>
  <text x="24" y="104" fill="#14263f" font-size="13" font-weight="700">Title</text>
  <rect x="24" y="112" width="752" height="36" rx="8" fill="#fff" stroke="#b42318" stroke-width="2"/>
  <text x="24" y="166" fill="#b42318" font-size="12">✕ Title is required</text>
  <text x="24" y="196" fill="#14263f" font-size="13" font-weight="700">Description (optional)</text>
  <rect x="24" y="204" width="752" height="80" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="226" fill="#5b6b7d" font-size="14">Placeholder description…</text>
  <text x="24" y="316" fill="#14263f" font-size="13" font-weight="700">Priority</text>
  <rect x="24" y="324" width="360" height="36" rx="8" fill="#fff" stroke="#b42318" stroke-width="2"/>
  <text x="36" y="346" fill="#14263f" font-size="14">Select… ▾</text>
  <text x="24" y="378" fill="#b42318" font-size="12">✕ Choose a priority</text>
  <text x="400" y="316" fill="#14263f" font-size="13" font-weight="700">Status</text>
  <rect x="400" y="324" width="376" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="412" y="346" fill="#14263f" font-size="14">To do ▾</text>
  <rect x="520" y="424" width="120" height="36" rx="8" fill="#fff" stroke="#14263f"/><text x="580" y="447" fill="#14263f" font-size="14" text-anchor="middle">Cancel</text>
  <rect x="656" y="424" width="120" height="36" rx="8" fill="#0e9384"/><text x="716" y="447" fill="#fff" font-size="14" text-anchor="middle">Save</text>
</svg>
