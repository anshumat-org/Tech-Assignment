<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Task list wireframe</title>
  <desc id="d">Sample wireframe: filter row, task table with status and priority chips carrying text, and pagination, with filters applied. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Tasks</text>
  <rect x="636" y="66" width="140" height="36" rx="8" fill="#0e9384"/><text x="706" y="89" fill="#fff" font-size="14" text-anchor="middle">+ New task</text>
  <text x="24" y="122" fill="#14263f" font-size="13" font-weight="700">Search</text>
  <rect x="24" y="130" width="260" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="152" fill="#5b6b7d" font-size="14">Search title…</text>
  <text x="300" y="122" fill="#14263f" font-size="13" font-weight="700">Status</text>
  <rect x="300" y="130" width="160" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="312" y="152" fill="#14263f" font-size="14">In progress ▾</text>
  <text x="476" y="122" fill="#14263f" font-size="13" font-weight="700">Priority</text>
  <rect x="476" y="130" width="160" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="488" y="152" fill="#14263f" font-size="14">Any ▾</text>
  <rect x="652" y="130" width="124" height="36" rx="8" fill="#fff" stroke="#14263f"/><text x="714" y="153" fill="#14263f" font-size="14" text-anchor="middle">Clear filters</text>
  <rect x="24" y="186" width="752" height="32" rx="8" fill="#e8f0fe" stroke="#1d4fb0"/><text x="40" y="207" fill="#1d4fb0" font-size="13">Filtered: status = In progress · 3 results</text>
  <rect x="24" y="228" width="752" height="36" fill="#14263f"/>
  <text x="40" y="251" fill="#fff" font-size="13" font-weight="700">Title</text>
  <text x="380" y="251" fill="#fff" font-size="13" font-weight="700">Status</text>
  <text x="520" y="251" fill="#fff" font-size="13" font-weight="700">Priority</text>
  <text x="660" y="251" fill="#fff" font-size="13" font-weight="700">Updated</text>
  <rect x="24" y="264" width="752" height="44" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="291" fill="#14263f" font-size="14">Placeholder task one</text>
  <text x="660" y="291" fill="#14263f" font-size="14">2h ago</text>
  <rect x="380" y="275" width="116" height="22" rx="11" fill="#e8f0fe"/><text x="438" y="291" font-size="12" fill="#1d4fb0" text-anchor="middle">◐ In progress</text>
  <rect x="520" y="275" width="96" height="22" rx="11" fill="#fde8e6"/><text x="568" y="291" font-size="12" fill="#b42318" text-anchor="middle">▲ High</text>
  <rect x="24" y="308" width="752" height="44" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="335" fill="#14263f" font-size="14">Placeholder task two</text>
  <text x="660" y="335" fill="#14263f" font-size="14">1d ago</text>
  <rect x="380" y="319" width="116" height="22" rx="11" fill="#e8f0fe"/><text x="438" y="335" font-size="12" fill="#1d4fb0" text-anchor="middle">◐ In progress</text>
  <rect x="520" y="319" width="96" height="22" rx="11" fill="#fff4e0"/><text x="568" y="335" font-size="12" fill="#b26a00" text-anchor="middle">■ Medium</text>
  <rect x="24" y="352" width="752" height="44" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="379" fill="#14263f" font-size="14">Placeholder task three</text>
  <text x="660" y="379" fill="#14263f" font-size="14">3d ago</text>
  <rect x="380" y="363" width="116" height="22" rx="11" fill="#e8f0fe"/><text x="438" y="379" font-size="12" fill="#1d4fb0" text-anchor="middle">◐ In progress</text>
  <rect x="520" y="363" width="96" height="22" rx="11" fill="#eef3f7"/><text x="568" y="379" font-size="12" fill="#5b6b7d" text-anchor="middle">▼ Low</text>
  <text x="24" y="420" fill="#5b6b7d" font-size="13">Page 1 of 1</text>
  <rect x="600" y="404" width="80" height="32" rx="8" fill="#d5dee6"/><text x="640" y="425" fill="#5b6b7d" font-size="14" text-anchor="middle">‹ Prev</text>
  <rect x="696" y="404" width="80" height="32" rx="8" fill="#d5dee6"/><text x="736" y="425" fill="#5b6b7d" font-size="14" text-anchor="middle">Next ›</text>
</svg>
