<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Delete confirm dialog wireframe</title>
  <desc id="d">Sample wireframe: confirm dialog naming the task, showing the delete error state. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Tasks · Detail</text>
  <text x="24" y="126" fill="#14263f" font-size="20" font-weight="700">Placeholder task one</text>
  <rect width="800" height="480" fill="#14263f" fill-opacity="0.45"/>
  <rect x="180" y="110" width="440" height="260" rx="12" fill="#fff" stroke="#d5dee6"/>
  <text x="204" y="150" fill="#14263f" font-size="18" font-weight="700">Delete this task?</text>
  <text x="204" y="180" fill="#14263f" font-size="14">“Placeholder task one” will be removed.</text>
  <text x="204" y="202" fill="#5b6b7d" font-size="13">This cannot be undone.</text>
  <rect x="204" y="222" width="392" height="40" rx="8" fill="#fde8e6" stroke="#b42318"/><text x="220" y="247" fill="#b42318" font-size="13">✕ Could not delete. Check connection and try again.</text>
  <rect x="340" y="306" width="120" height="36" rx="8" fill="#fff" stroke="#14263f"/><text x="400" y="329" fill="#14263f" font-size="14" text-anchor="middle">Cancel</text>
  <rect x="476" y="306" width="120" height="36" rx="8" fill="#b42318"/><text x="536" y="329" fill="#fff" font-size="14" text-anchor="middle">Delete</text>
  <rect x="616" y="70" width="160" height="22" rx="11" fill="#e8f0fe"/><text x="696" y="86" font-size="12" fill="#1d4fb0" text-anchor="middle">State: error</text>
</svg>
