<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Task detail wireframe</title>
  <desc id="d">Sample wireframe: task fields with a status control, Edit and Delete, and a chronological activity timeline. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Tasks · Detail</text>
  <text x="24" y="92" fill="#0e9384" font-size="13">‹ Back to list</text>
  <text x="24" y="126" fill="#14263f" font-size="20" font-weight="700">Placeholder task one</text>
  <rect x="560" y="100" width="100" height="36" rx="8" fill="#fff" stroke="#14263f"/><text x="610" y="123" fill="#14263f" font-size="14" text-anchor="middle">Edit</text>
  <rect x="676" y="100" width="100" height="36" rx="8" fill="#b42318"/><text x="726" y="123" fill="#fff" font-size="14" text-anchor="middle">Delete</text>
  <rect x="24" y="142" width="116" height="22" rx="11" fill="#e8f0fe"/><text x="82" y="158" font-size="12" fill="#1d4fb0" text-anchor="middle">◐ In progress</text>
  <rect x="150" y="142" width="96" height="22" rx="11" fill="#fde8e6"/><text x="198" y="158" font-size="12" fill="#b42318" text-anchor="middle">▲ High</text>
  <text x="24" y="190" fill="#5b6b7d" font-size="14">Placeholder description text for the task.</text>
  <text x="24" y="214" fill="#14263f" font-size="13" font-weight="700">Change status</text>
  <rect x="24" y="222" width="220" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="244" fill="#14263f" font-size="14">Done ▾</text>
  <rect x="260" y="222" width="516" height="36" rx="8" fill="#e3f4ea" stroke="#1a7f4b"/><text x="276" y="245" fill="#1a7f4b" font-size="13">✓ Status updated to Done</text>
  <text x="24" y="304" fill="#14263f" font-size="15" font-weight="700">Activity</text>
  <line x1="34" y1="318" x2="34" y2="452" stroke="#d5dee6" stroke-width="2"/>
  <circle cx="34" cy="325" r="5" fill="#0e9384"/>
  <text x="52" y="330" fill="#14263f" font-size="13" font-weight="700">Status changed</text>
  <text x="200" y="330" fill="#14263f" font-size="13">In progress → Done</text>
  <text x="776" y="330" fill="#5b6b7d" font-size="12" text-anchor="end">just now</text>
  <circle cx="34" cy="359" r="5" fill="#0e9384"/>
  <text x="52" y="364" fill="#14263f" font-size="13" font-weight="700">Edited</text>
  <text x="200" y="364" fill="#14263f" font-size="13">Priority: Medium → High</text>
  <text x="776" y="364" fill="#5b6b7d" font-size="12" text-anchor="end">1h ago</text>
  <circle cx="34" cy="393" r="5" fill="#0e9384"/>
  <text x="52" y="398" fill="#14263f" font-size="13" font-weight="700">Status changed</text>
  <text x="200" y="398" fill="#14263f" font-size="13">To do → In progress</text>
  <text x="776" y="398" fill="#5b6b7d" font-size="12" text-anchor="end">2h ago</text>
  <circle cx="34" cy="427" r="5" fill="#0e9384"/>
  <text x="52" y="432" fill="#14263f" font-size="13" font-weight="700">Created</text>
  <text x="200" y="432" fill="#14263f" font-size="13">Task created</text>
  <text x="776" y="432" fill="#5b6b7d" font-size="12" text-anchor="end">3h ago</text>
</svg>
