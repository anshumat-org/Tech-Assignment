<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, 'Noto Sans Devanagari', 'Nirmala UI', Mangal, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Shop settings wireframe</title>
  <desc id="d">Settings for language, timezone, business-day boundary and users and roles, after saving. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="56" rx="0" fill="#14263f"/><text x="24" y="35" fill="#ffffff" font-size="16" font-weight="700">Sample Kirana Store (demo)</text><rect x="640" y="14" width="136" height="28" rx="14" fill="none" stroke="#ffffff"/>
  <rect x="708" y="14" width="68" height="28" rx="14" fill="#0e9384"/>
  <text x="674" y="33" fill="#ffffff" font-size="12" text-anchor="middle">हिंदी</text>
  <text x="742" y="33" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">English</text>
  <text x="24" y="92" fill="#14263f" font-size="16" font-weight="700">Settings</text>
  <rect x="24" y="104" width="752" height="34" rx="6" fill="#ffffff" stroke="#1a7f4b" stroke-width="1.5"/><rect x="24" y="104" width="5" height="34" rx="2" fill="#1a7f4b"/><text x="40" y="126.0" fill="#1a7f4b" font-size="13" font-weight="700">✓ Saved</text><text x="99.0" y="126.0" fill="#14263f" font-size="12">Changes apply from the next business day.</text>
  <text x="24" y="170" fill="#5b6b7d" font-size="12">Language</text>
  <rect x="24" y="178" width="64" height="22" rx="11" fill="#0e9384" stroke="#0e9384"/><text x="56.0" y="193" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ हिंदी</text>
  <rect x="92" y="178" width="64" height="22" rx="11" fill="#ffffff" stroke="#0e9384"/><text x="124.0" y="193" fill="#0e9384" font-size="11" font-weight="700" text-anchor="middle">English</text>
  <text x="24" y="222" fill="#5b6b7d" font-size="12">Timezone</text><rect x="24" y="230" width="340" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="36" y="252" fill="#14263f" font-size="13">Asia/Kolkata (UTC+05:30)</text>
  <text x="24" y="288" fill="#5b6b7d" font-size="12">Business day starts at</text><rect x="24" y="296" width="340" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="36" y="318" fill="#14263f" font-size="13">04:00</text>
  <text x="24" y="350" fill="#5b6b7d" font-size="11">Sales after midnight count toward the previous day until then.</text>
  <text x="400" y="170" fill="#5b6b7d" font-size="12" font-weight="700">Users and roles</text>
  <rect x="400" y="180" width="376" height="128" rx="8" fill="#ffffff" stroke="#d5dee6"/>
  <rect x="400" y="180" width="376" height="32" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="410" y="200.0" fill="#5b6b7d" font-size="12" font-weight="700">User</text><text x="560" y="200.0" fill="#5b6b7d" font-size="12" font-weight="700">Role</text><text x="670" y="200.0" fill="#5b6b7d" font-size="12" font-weight="700">Status</text>
  <line x1="400" y1="212" x2="776" y2="212" stroke="#d5dee6" stroke-width="1"/>
  <text x="410" y="232.0" fill="#14263f" font-size="12">Owner O</text><text x="560" y="232.0" fill="#14263f" font-size="12">Owner</text><text x="670" y="232.0" fill="#14263f" font-size="12">Active</text>
  <line x1="400" y1="244" x2="776" y2="244" stroke="#d5dee6" stroke-width="1"/>
  <text x="410" y="264.0" fill="#14263f" font-size="12">Staff S</text><text x="560" y="264.0" fill="#14263f" font-size="12">Staff</text><text x="670" y="264.0" fill="#14263f" font-size="12">Active</text>
  <line x1="400" y1="276" x2="776" y2="276" stroke="#d5dee6" stroke-width="1"/>
  <text x="410" y="296.0" fill="#14263f" font-size="12">Accountant A</text><text x="560" y="296.0" fill="#14263f" font-size="12">Accountant</text><text x="670" y="296.0" fill="#14263f" font-size="12">Invited</text>
  <rect x="616" y="330" width="160" height="36" rx="8" fill="#ffffff" stroke="#14263f"/><text x="696.0" y="353.0" fill="#14263f" font-size="14" text-anchor="middle">Invite user</text>
</svg>
