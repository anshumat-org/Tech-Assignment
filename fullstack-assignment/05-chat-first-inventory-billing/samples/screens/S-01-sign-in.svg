<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, 'Noto Sans Devanagari', 'Nirmala UI', Mangal, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Shop sign in wireframe</title>
  <desc id="d">Sign in with phone or email, password and language choice, showing an error. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="56" rx="0" fill="#14263f"/><text x="24" y="35" fill="#ffffff" font-size="16" font-weight="700">Sample Kirana Store (demo)</text><rect x="640" y="14" width="136" height="28" rx="14" fill="none" stroke="#ffffff"/>
  <rect x="708" y="14" width="68" height="28" rx="14" fill="#0e9384"/>
  <text x="674" y="33" fill="#ffffff" font-size="12" text-anchor="middle">हिंदी</text>
  <text x="742" y="33" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">English</text>
  <rect x="220" y="76" width="360" height="384" rx="8" fill="#ffffff" stroke="#d5dee6"/>
  <text x="400" y="114" fill="#14263f" font-size="20" font-weight="700" text-anchor="middle">Sign in to your shop</text>
  <rect x="244" y="132" width="312" height="36" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/><rect x="244" y="132" width="5" height="36" rx="2" fill="#b42318"/><text x="260" y="155.0" fill="#b42318" font-size="13" font-weight="700">✕ Error</text><text x="319.0" y="155.0" fill="#14263f" font-size="12">Phone or password is incorrect.</text>
  <text x="244" y="192" fill="#5b6b7d" font-size="12">Phone or email</text><rect x="244" y="200" width="312" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="256" y="222" fill="#14263f" font-size="13">98XXXXXX10</text>
  <text x="244" y="258" fill="#5b6b7d" font-size="12">Password</text><rect x="244" y="266" width="312" height="34" rx="6" fill="#ffffff" stroke="#1d6fe0" stroke-width="2"/><text x="256" y="288" fill="#14263f" font-size="13">••••••••</text>
  <text x="244" y="326" fill="#5b6b7d" font-size="12">Language · भाषा</text>
  <rect x="244" y="334" width="51" height="22" rx="11" fill="#ffffff" stroke="#0e9384"/><text x="269.5" y="349" fill="#0e9384" font-size="11" font-weight="700" text-anchor="middle">हिंदी</text>
  <rect x="300" y="334" width="77" height="22" rx="11" fill="#0e9384" stroke="#0e9384"/><text x="338.5" y="349" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ English</text>
  <rect x="244" y="376" width="312" height="36" rx="8" fill="#0e9384"/><text x="400.0" y="399.0" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Sign in</text>
  <text x="400" y="440" fill="#5b6b7d" font-size="11" text-anchor="middle">State shown: error</text>
