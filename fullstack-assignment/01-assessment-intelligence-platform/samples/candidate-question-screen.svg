  </g>
  <text x="40" y="180" fill="#5b6b7d" font-size="11">Filled = current · outline = answered</text>
  <text x="40" y="200" fill="#5b6b7d" font-size="11">Plain = unanswered</text>
  <rect x="228" y="76" width="548" height="300" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="248" y="104" fill="#5b6b7d" font-size="12">Question 2 of 20 · Select all that apply · 2 marks</text>
  <text x="248" y="134" fill="#14263f" font-size="15" font-weight="700">Which statements describe an index? (placeholder text)</text>
  <g font-size="14" fill="#14263f">
    <rect x="248" y="154" width="508" height="44" rx="8" fill="#fff" stroke="#0e9384" stroke-width="2"/>
    <rect x="262" y="167" width="18" height="18" rx="3" fill="#0e9384"/><text x="292" y="181">Option A (placeholder)</text>
    <rect x="248" y="206" width="508" height="44" rx="8" fill="#fff" stroke="#d5dee6"/>
    <rect x="262" y="219" width="18" height="18" rx="3" fill="#fff" stroke="#5b6b7d"/><text x="292" y="233">Option B (placeholder)</text>
    <rect x="248" y="258" width="508" height="44" rx="8" fill="#fff" stroke="#d5dee6"/>
    <rect x="262" y="271" width="18" height="18" rx="3" fill="#fff" stroke="#5b6b7d"/><text x="292" y="285">Option C (placeholder)</text>
    <rect x="248" y="310" width="508" height="44" rx="8" fill="#fff" stroke="#d5dee6"/>
    <rect x="262" y="323" width="18" height="18" rx="3" fill="#fff" stroke="#5b6b7d"/><text x="292" y="337">Option D (placeholder)</text>
