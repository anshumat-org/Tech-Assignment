  <rect x="348" y="424" width="110" height="36" rx="8" fill="#0e9384"/><text x="403" y="447" font-size="14" fill="#fff" text-anchor="middle">Next</text>
  <rect x="640" y="424" width="136" height="36" rx="8" fill="#fff" stroke="#14263f"/><text x="708" y="447" font-size="14" fill="#14263f" text-anchor="middle">Review &amp; submit</text>
