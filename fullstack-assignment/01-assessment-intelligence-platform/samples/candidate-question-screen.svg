<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Candidate question screen wireframe</title>
  <desc id="d">Sample wireframe: timer, question navigator, a multiple-choice question and save status. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#ffffff" font-size="16" font-weight="700">Sample Technical Assessment</text>
  <rect x="620" y="14" width="156" height="28" rx="14" fill="#0e9384"/>
  <text x="698" y="33" fill="#ffffff" font-size="14" text-anchor="middle">Time left 42:18</text>
  <rect x="24" y="76" width="180" height="380" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="102" fill="#14263f" font-size="13" font-weight="700">Section 1 · SQL</text>
  <g font-size="12" fill="#14263f" text-anchor="middle">
