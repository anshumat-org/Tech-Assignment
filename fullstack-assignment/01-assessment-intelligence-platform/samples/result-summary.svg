<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Result summary wireframe</title>
  <desc id="d">Sample wireframe: technical section totals and illustrative psychometric dimension bars with no right or wrong colouring. Numbers are placeholders.</desc>
  <rect width="800" height="440" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Result summary (sample data)</text>
  <text x="24" y="92" fill="#14263f" font-size="15" font-weight="700">Technical sections</text>
  <rect x="24" y="104" width="360" height="30" fill="#14263f"/>
  <g fill="#fff" font-size="12" font-weight="700"><text x="36" y="124">Section</text><text x="220" y="124">Score</text><text x="300" y="124">Max</text></g>
  <g font-size="13" fill="#14263f">
    <rect x="24" y="134" width="360" height="30" fill="#fff" stroke="#d5dee6"/><text x="36" y="154">SQL</text><text x="220" y="154">9</text><text x="300" y="154">12</text>
    <rect x="24" y="164" width="360" height="30" fill="#eef3f7" stroke="#d5dee6"/><text x="36" y="184">Data Modeling</text><text x="220" y="184">6</text><text x="300" y="184">8</text>
    <rect x="24" y="194" width="360" height="30" fill="#fff" stroke="#d5dee6"/><text x="36" y="214">Total</text><text x="220" y="214" font-weight="700">15</text><text x="300" y="214">20</text>
  </g>
  <text x="420" y="92" fill="#14263f" font-size="15" font-weight="700">Psychometric dimensions</text>
  <g font-size="13" fill="#14263f">
    <text x="420" y="124">Dimension A</text><rect x="540" y="112" width="220" height="16" rx="8" fill="#eef3f7"/><rect x="540" y="112" width="150" height="16" rx="8" fill="#0e9384"/>
    <text x="420" y="158">Dimension B</text><rect x="540" y="146" width="220" height="16" rx="8" fill="#eef3f7"/><rect x="540" y="146" width="90" height="16" rx="8" fill="#0e9384"/>
    <text x="420" y="192">Dimension C</text><rect x="540" y="180" width="220" height="16" rx="8" fill="#eef3f7"/><rect x="540" y="180" width="190" height="16" rx="8" fill="#0e9384"/>
  </g>
  <rect x="420" y="214" width="340" height="44" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="436" y="233" fill="#14263f" font-size="12" font-weight="700">Illustrative summary.</text>
  <text x="436" y="249" fill="#5b6b7d" font-size="12">Not a clinical or diagnostic result. No answers are right or wrong.</text>
  <rect x="24" y="290" width="736" height="120" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="318" fill="#14263f" font-size="14" font-weight="700">Performance summary</text>
  <text x="40" y="342" fill="#5b6b7d" font-size="13">• Strongest section: SQL (placeholder)</text>
  <text x="40" y="364" fill="#5b6b7d" font-size="13">• Time used: 38 of 60 minutes (placeholder)</text>
  <text x="40" y="386" fill="#5b6b7d" font-size="13">• Attempt submitted once; result is final</text>
</svg>
