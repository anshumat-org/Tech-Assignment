<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Assessments list wireframe</title>
  <desc id="d">Sample wireframe: assessments table with type and draft or published status chips carrying text. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Admin · Assessments</text>
  <rect x="616" y="70" width="160" height="22" rx="11" fill="#e8f0fe"/><text x="696" y="86" font-size="12" fill="#1d4fb0" text-anchor="middle">State: ready</text>
  <rect x="616" y="104" width="160" height="36" rx="8" fill="#0e9384"/><text x="696" y="127" fill="#fff" font-size="14" text-anchor="middle">+ New assessment</text>
  <rect x="24" y="156" width="752" height="36" fill="#14263f"/>
  <text x="40" y="179" fill="#fff" font-size="13" font-weight="700">Name</text>
  <text x="330" y="179" fill="#fff" font-size="13" font-weight="700">Type</text>
  <text x="480" y="179" fill="#fff" font-size="13" font-weight="700">Status</text>
  <text x="640" y="179" fill="#fff" font-size="13" font-weight="700">Action</text>
  <rect x="24" y="192" width="752" height="44" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="219" fill="#14263f" font-size="14">Sample Assessment A</text>
  <text x="330" y="219" fill="#14263f" font-size="14">Technical</text>
  <rect x="480" y="203" width="110" height="22" rx="11" fill="#e3f4ea"/><text x="535" y="219" font-size="12" fill="#1a7f4b" text-anchor="middle">✓ Published</text>
  <text x="640" y="219" fill="#0e9384" font-size="14">Open ›</text>
  <rect x="24" y="236" width="752" height="44" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="263" fill="#14263f" font-size="14">Sample Assessment B</text>
  <text x="330" y="263" fill="#14263f" font-size="14">Psychometric</text>
  <rect x="480" y="247" width="110" height="22" rx="11" fill="#fff4e0"/><text x="535" y="263" font-size="12" fill="#b26a00" text-anchor="middle">✎ Draft</text>
  <text x="640" y="263" fill="#0e9384" font-size="14">Open ›</text>
  <rect x="24" y="280" width="752" height="44" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="307" fill="#14263f" font-size="14">Sample Assessment C</text>
  <text x="330" y="307" fill="#14263f" font-size="14">Mixed</text>
  <rect x="480" y="291" width="110" height="22" rx="11" fill="#fff4e0"/><text x="535" y="307" font-size="12" fill="#b26a00" text-anchor="middle">✎ Draft</text>
  <text x="640" y="307" fill="#0e9384" font-size="14">Open ›</text>
  <text x="24" y="340" fill="#5b6b7d" font-size="12">Status is text plus icon, never colour alone.</text>
</svg>
