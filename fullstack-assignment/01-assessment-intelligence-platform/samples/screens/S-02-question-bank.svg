<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Question bank wireframe</title>
  <desc id="d">Sample wireframe: question bank with category, difficulty and status filters, showing the empty state for the current filters. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Admin · Question bank</text>
  <rect x="616" y="70" width="160" height="22" rx="11" fill="#e8f0fe"/><text x="696" y="86" font-size="12" fill="#1d4fb0" text-anchor="middle">State: empty</text>
  <text x="24" y="108" fill="#14263f" font-size="13" font-weight="700">Search</text>
  <rect x="24" y="116" width="220" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="138" fill="#5b6b7d" font-size="14">Search questions…</text>
  <text x="260" y="108" fill="#14263f" font-size="13" font-weight="700">Category</text>
  <rect x="260" y="116" width="150" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="272" y="138" fill="#14263f" font-size="14">SQL ▾</text>
  <text x="422" y="108" fill="#14263f" font-size="13" font-weight="700">Difficulty</text>
  <rect x="422" y="116" width="150" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="434" y="138" fill="#14263f" font-size="14">Hard ▾</text>
  <text x="584" y="108" fill="#14263f" font-size="13" font-weight="700">Status</text>
  <rect x="584" y="116" width="120" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="596" y="138" fill="#14263f" font-size="14">Archived ▾</text>
  <rect x="716" y="116" width="60" height="36" rx="8" fill="#fff" stroke="#14263f"/><text x="746" y="139" fill="#14263f" font-size="14" text-anchor="middle">Clear</text>
  <rect x="24" y="160" width="752" height="36" fill="#14263f"/>
  <text x="40" y="183" fill="#fff" font-size="13" font-weight="700">Question</text>
  <text x="360" y="183" fill="#fff" font-size="13" font-weight="700">Category</text>
  <text x="470" y="183" fill="#fff" font-size="13" font-weight="700">Difficulty</text>
  <text x="580" y="183" fill="#fff" font-size="13" font-weight="700">Status</text>
  <text x="680" y="183" fill="#fff" font-size="13" font-weight="700">Action</text>
  <rect x="24" y="196" width="752" height="200" rx="12" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="400" y="262" fill="#14263f" font-size="16" font-weight="700" text-anchor="middle">No questions match these filters</text>
  <text x="400" y="288" fill="#5b6b7d" font-size="13" text-anchor="middle">Try another category or difficulty, or clear the filters.</text>
  <rect x="320" y="310" width="160" height="36" rx="8" fill="#fff" stroke="#14263f"/><text x="400" y="333" fill="#14263f" font-size="14" text-anchor="middle">Clear filters</text>
  <rect x="616" y="420" width="160" height="36" rx="8" fill="#0e9384"/><text x="696" y="443" fill="#fff" font-size="14" text-anchor="middle">+ New question</text>
</svg>
