<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Question form wireframe</title>
  <desc id="d">Sample wireframe: add-question form with type, category, difficulty, marks and placeholder options, showing a validation error. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Admin · New question</text>
  <rect x="616" y="70" width="160" height="22" rx="11" fill="#e8f0fe"/><text x="696" y="86" font-size="12" fill="#1d4fb0" text-anchor="middle">State: validation error</text>
  <rect x="24" y="104" width="752" height="40" rx="8" fill="#fde8e6" stroke="#b42318"/><text x="40" y="129" fill="#b42318" font-size="13">✕ 2 fields need attention before you can save.</text>
  <text x="24" y="172" fill="#14263f" font-size="13" font-weight="700">Type</text>
  <rect x="24" y="180" width="170" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="202" fill="#14263f" font-size="14">Single choice ▾</text>
  <text x="210" y="172" fill="#14263f" font-size="13" font-weight="700">Category</text>
  <rect x="210" y="180" width="170" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="222" y="202" fill="#14263f" font-size="14">SQL ▾</text>
  <text x="396" y="172" fill="#14263f" font-size="13" font-weight="700">Difficulty</text>
  <rect x="396" y="180" width="170" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="408" y="202" fill="#14263f" font-size="14">Medium ▾</text>
  <text x="582" y="172" fill="#14263f" font-size="13" font-weight="700">Marks</text>
  <rect x="582" y="180" width="194" height="36" rx="8" fill="#fff" stroke="#b42318" stroke-width="2"/>
  <text x="582" y="234" fill="#b42318" font-size="12">✕ Enter marks greater than 0</text>
  <text x="24" y="262" fill="#14263f" font-size="13" font-weight="700">Question text</text>
  <rect x="24" y="270" width="752" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="292" fill="#5b6b7d" font-size="14">Placeholder question text…</text>
  <text x="24" y="334" fill="#14263f" font-size="13" font-weight="700">Options</text>
  <rect x="24" y="344" width="560" height="30" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="364" fill="#14263f" font-size="13">Option A (placeholder)</text>
  <circle cx="610" cy="359" r="8" fill="#fff" stroke="#5b6b7d"/>
  <text x="626" y="364" fill="#5b6b7d" font-size="12">Mark as correct</text>
  <rect x="24" y="380" width="560" height="30" rx="6" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="400" fill="#14263f" font-size="13">Option B (placeholder)</text>
  <circle cx="610" cy="395" r="8" fill="#fff" stroke="#5b6b7d"/>
  <text x="626" y="400" fill="#5b6b7d" font-size="12">Mark as correct</text>
  <text x="24" y="432" fill="#b42318" font-size="12">✕ Mark one option as correct.</text>
  <rect x="520" y="432" width="120" height="36" rx="8" fill="#fff" stroke="#14263f"/><text x="580" y="455" fill="#14263f" font-size="14" text-anchor="middle">Cancel</text>
  <rect x="656" y="432" width="120" height="36" rx="8" fill="#0e9384"/><text x="716" y="455" fill="#fff" font-size="14" text-anchor="middle">Save</text>
</svg>
