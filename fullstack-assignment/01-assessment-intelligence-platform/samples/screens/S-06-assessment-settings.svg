<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Assessment settings wireframe</title>
  <desc id="d">Sample wireframe: assessment structure form with sections and placeholder scoring settings, showing a validation error. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Admin · Assessment settings</text>
  <rect x="616" y="70" width="160" height="22" rx="11" fill="#e8f0fe"/><text x="696" y="86" font-size="12" fill="#1d4fb0" text-anchor="middle">State: validation error</text>
  <text x="24" y="112" fill="#14263f" font-size="13" font-weight="700">Name</text>
  <rect x="24" y="120" width="360" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="142" fill="#14263f" font-size="14">Sample Assessment B</text>
  <text x="400" y="112" fill="#14263f" font-size="13" font-weight="700">Type</text>
  <rect x="400" y="120" width="180" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="412" y="142" fill="#14263f" font-size="14">Mixed ▾</text>
  <text x="596" y="112" fill="#14263f" font-size="13" font-weight="700">Duration (minutes)</text>
  <rect x="596" y="120" width="180" height="36" rx="8" fill="#fff" stroke="#b42318" stroke-width="2"/>
  <text x="608" y="142" fill="#14263f" font-size="14">0</text>
  <text x="596" y="174" fill="#b42318" font-size="12">✕ Enter 1 or more minutes</text>
  <text x="24" y="204" fill="#14263f" font-size="13" font-weight="700">Sections</text>
  <rect x="24" y="214" width="752" height="36" fill="#14263f"/>
  <text x="40" y="237" fill="#fff" font-size="13" font-weight="700">Section</text>
  <text x="360" y="237" fill="#fff" font-size="13" font-weight="700">Questions from blueprint</text>
  <text x="620" y="237" fill="#fff" font-size="13" font-weight="700">Order</text>
  <rect x="24" y="250" width="752" height="40" fill="#fff" stroke="#d5dee6"/>
  <text x="40" y="275" fill="#14263f" font-size="14">Section 1 · placeholder</text>
  <text x="360" y="275" fill="#14263f" font-size="14">See blueprint</text>
  <text x="620" y="275" fill="#14263f" font-size="14">1</text>
  <rect x="24" y="290" width="752" height="40" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="315" fill="#14263f" font-size="14">Section 2 · placeholder</text>
  <text x="360" y="315" fill="#14263f" font-size="14">See blueprint</text>
  <text x="620" y="315" fill="#14263f" font-size="14">2</text>
  <text x="24" y="352" fill="#14263f" font-size="13" font-weight="700">Scoring rule</text>
  <rect x="24" y="360" width="360" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="382" fill="#14263f" font-size="14">Placeholder rule ▾</text>
  <text x="400" y="352" fill="#14263f" font-size="13" font-weight="700">Negative marking</text>
  <rect x="400" y="360" width="180" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="412" y="382" fill="#14263f" font-size="14">Off ▾</text>
  <rect x="520" y="432" width="120" height="36" rx="8" fill="#fff" stroke="#14263f"/><text x="580" y="455" fill="#14263f" font-size="14" text-anchor="middle">Cancel</text>
  <rect x="656" y="432" width="120" height="36" rx="8" fill="#d5dee6"/><text x="716" y="455" fill="#5b6b7d" font-size="14" text-anchor="middle">Save</text>
</svg>
