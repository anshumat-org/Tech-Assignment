<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Results list wireframe</title>
  <desc id="d">Sample wireframe: admin results table with filters, showing the empty state before any attempt is submitted. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Admin · Results</text>
  <rect x="616" y="70" width="160" height="22" rx="11" fill="#e8f0fe"/><text x="696" y="86" font-size="12" fill="#1d4fb0" text-anchor="middle">State: empty</text>
  <text x="24" y="92" fill="#14263f" font-size="13" font-weight="700">Assessment</text>
  <rect x="24" y="100" width="300" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="36" y="122" fill="#14263f" font-size="14">Sample Assessment A ▾</text>
  <text x="340" y="92" fill="#14263f" font-size="13" font-weight="700">Search candidate</text>
  <rect x="340" y="100" width="240" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="352" y="122" fill="#5b6b7d" font-size="14">Name or email…</text>
  <rect x="24" y="160" width="752" height="36" fill="#14263f"/>
  <text x="40" y="183" fill="#fff" font-size="13" font-weight="700">Candidate</text>
  <text x="260" y="183" fill="#fff" font-size="13" font-weight="700">Assessment</text>
  <text x="460" y="183" fill="#fff" font-size="13" font-weight="700">Section totals</text>
  <text x="660" y="183" fill="#fff" font-size="13" font-weight="700">Action</text>
  <rect x="24" y="196" width="752" height="200" rx="12" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="400" y="270" fill="#14263f" font-size="16" font-weight="700" text-anchor="middle">No submitted attempts yet</text>
  <text x="400" y="296" fill="#5b6b7d" font-size="13" text-anchor="middle">Results appear here after candidates submit.</text>
</svg>
