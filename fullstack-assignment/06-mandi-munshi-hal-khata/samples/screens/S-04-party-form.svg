<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, 'Noto Sans Devanagari', 'Nirmala UI', Mangal, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Party form wireframe</title>
  <desc id="d">Party form with English and Hindi names, type, phone and opening balance Dr or Cr, with a validation error. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="56" rx="0" fill="#14263f"/><text x="24" y="35" fill="#ffffff" font-size="16" font-weight="700">Sample Aadhat Firm (demo)</text><rect x="640" y="14" width="136" height="28" rx="14" fill="none" stroke="#ffffff"/>
  <rect x="708" y="14" width="68" height="28" rx="14" fill="#0e9384"/>
  <text x="674" y="33" fill="#ffffff" font-size="12" text-anchor="middle">हिंदी</text>
  <text x="742" y="33" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">English</text>
  <text x="24" y="90" fill="#14263f" font-size="16" font-weight="700">Add party</text>
  <rect x="24" y="102" width="752" height="36" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/><rect x="24" y="102" width="5" height="36" rx="2" fill="#b42318"/><text x="40" y="125.0" fill="#b42318" font-size="13" font-weight="700">✕ Check 1 field</text><text x="158.2" y="125.0" fill="#14263f" font-size="12">Opening balance needs Dr or Cr.</text>
  <text x="24" y="162" fill="#5b6b7d" font-size="12">Name (English)</text><rect x="24" y="170" width="360" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="36" y="192" fill="#14263f" font-size="13">Farmer F (sample)</text>
  <text x="416" y="162" fill="#5b6b7d" font-size="12">नाम (हिंदी)</text><rect x="416" y="170" width="360" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="428" y="192" fill="#14263f" font-size="13">किसान एफ़ (नमूना)</text>
  <text x="24" y="238" fill="#5b6b7d" font-size="12">Type</text>
  <rect x="24" y="246" width="70" height="22" rx="11" fill="#0e9384" stroke="#0e9384"/><text x="59.0" y="261" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ Farmer</text>
  <rect x="104" y="246" width="51" height="22" rx="11" fill="#ffffff" stroke="#0e9384"/><text x="129.5" y="261" fill="#0e9384" font-size="11" font-weight="700" text-anchor="middle">Buyer</text>
  <rect x="162" y="246" width="64" height="22" rx="11" fill="#ffffff" stroke="#0e9384"/><text x="194.0" y="261" fill="#0e9384" font-size="11" font-weight="700" text-anchor="middle">Expense</text>
  <text x="416" y="230" fill="#5b6b7d" font-size="12">Phone</text><rect x="416" y="238" width="360" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="428" y="260" fill="#14263f" font-size="13">9XXXXXXXX0</text>
  <text x="24" y="298" fill="#5b6b7d" font-size="12">Opening balance</text><rect x="24" y="306" width="360" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="36" y="328" fill="#14263f" font-size="13">₹12,500.00</text>
  <text x="416" y="306" fill="#5b6b7d" font-size="12">Dr or Cr</text>
  <rect x="416" y="314" width="80" height="34" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
  <text x="456" y="336" fill="#14263f" font-size="13" text-anchor="middle">○ Dr</text>
  <rect x="504" y="314" width="80" height="34" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
  <text x="544" y="336" fill="#14263f" font-size="13" text-anchor="middle">○ Cr</text>
  <text x="416" y="368" fill="#b42318" font-size="12">✕ Choose Dr or Cr</text>
  <rect x="536" y="420" width="110" height="36" rx="8" fill="#ffffff" stroke="#14263f"/><text x="591.0" y="443.0" fill="#14263f" font-size="14" text-anchor="middle">Cancel</text>
  <rect x="656" y="420" width="120" height="36" rx="8" fill="#0e9384"/><text x="716.0" y="443.0" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Save</text>
</svg>
