<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DigiLocker mock stepper wireframe</title>
  <desc id="d">Four-step mock DigiLocker stepper in the provider unavailable state with retry and upload instead. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="56" rx="0" fill="#14263f"/>
  <text x="24" y="35" fill="#ffffff" font-size="16" font-weight="700">Passport assistance (demo)</text>
  <rect x="477" y="15" width="299" height="26" rx="13" fill="#ffffff"/>
  <text x="626.5" y="32" fill="#b26a00" font-size="12" font-weight="700" text-anchor="middle">Simulated. Not the official passport system</text>
  <text x="24" y="92" fill="#14263f" font-size="16" font-weight="700">Link documents · DigiLocker (mock)</text>
  <rect x="330" y="76" width="77" height="22" rx="11" fill="#ffffff" stroke="#b26a00"/><text x="368.5" y="91" fill="#b26a00" font-size="11" font-weight="700" text-anchor="middle">Mock data</text>
  <rect x="24" y="112" width="178" height="40" rx="20" fill="#eef3f7" stroke="#0e9384"/>
  <text x="113" y="137" fill="#14263f" font-size="13" text-anchor="middle">✓ 1 Connect</text>
  <rect x="214" y="112" width="178" height="40" rx="20" fill="#eef3f7" stroke="#0e9384"/>
  <text x="303" y="137" fill="#14263f" font-size="13" text-anchor="middle">✓ 2 Authorise</text>
  <rect x="404" y="112" width="178" height="40" rx="20" fill="#0e9384" stroke="#0e9384"/>
  <text x="493" y="137" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3 Choose documents</text>
  <rect x="594" y="112" width="178" height="40" rx="20" fill="#ffffff" stroke="#d5dee6"/>
  <text x="683" y="137" fill="#5b6b7d" font-size="13" text-anchor="middle">4 Retrieve</text>
  <rect x="24" y="172" width="752" height="40" rx="6" fill="#ffffff" stroke="#b26a00" stroke-width="1.5"/><rect x="24" y="172" width="5" height="40" rx="2" fill="#b26a00"/><text x="40" y="197.0" fill="#b26a00" font-size="13" font-weight="700">⚠ Provider unavailable</text><text x="210.0" y="197.0" fill="#14263f" font-size="12">DigiLocker (mock) did not respond. Retrying in 10 s (attempt 2 of 3).</text>
  <rect x="24" y="228" width="752" height="168" rx="8" fill="#ffffff" stroke="#d5dee6"/><text x="40" y="254" fill="#14263f" font-size="14" font-weight="700">Choose documents</text>
  <rect x="40" y="262" width="720" height="1" rx="0" fill="#d5dee6"/>
  <text x="40" y="282" fill="#5b6b7d" font-size="13">☐  Document A (placeholder) · issuer: Sample Board</text>
  <text x="40" y="310" fill="#5b6b7d" font-size="13">☐  Document B (placeholder) · no. XXXX-XXXX-1234</text>
  <text x="40" y="338" fill="#5b6b7d" font-size="12">List not loaded yet. Your earlier choices are kept.</text>
  <text x="40" y="378" fill="#b26a00" font-size="11" font-weight="700">Simulated · nothing here comes from a real provider</text>
  <rect x="24" y="416" width="120" height="36" rx="8" fill="#0e9384"/><text x="84.0" y="439.0" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Retry now</text>
  <rect x="156" y="416" width="160" height="36" rx="8" fill="#ffffff" stroke="#14263f"/><text x="236.0" y="439.0" fill="#14263f" font-size="14" text-anchor="middle">Upload instead</text>
  <text x="776" y="440" fill="#5b6b7d" font-size="11" text-anchor="end">State shown: provider unavailable</text>
</svg>
