<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Profile form wireframe</title>
  <desc id="d">Profile form with a masked identity number and a validation error before review. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="56" rx="0" fill="#14263f"/>
  <text x="24" y="35" fill="#ffffff" font-size="16" font-weight="700">Passport assistance (demo)</text>
  <rect x="477" y="15" width="299" height="26" rx="13" fill="#ffffff"/>
  <text x="626.5" y="32" fill="#b26a00" font-size="12" font-weight="700" text-anchor="middle">Simulated. Not the official passport system</text>
  <text x="24" y="90" fill="#0e9384" font-size="13" font-weight="700">Step 1 of 2 · Details</text>
  <text x="190" y="90" fill="#5b6b7d" font-size="13">Step 2 · Review</text>
  <line x1="24" y1="100" x2="776" y2="100" stroke="#d5dee6" stroke-width="1"/>
  <rect x="24" y="112" width="752" height="36" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/><rect x="24" y="112" width="5" height="36" rx="2" fill="#b42318"/><text x="40" y="135.0" fill="#b42318" font-size="13" font-weight="700">✕ 1 field needs attention</text><text x="232.20000000000002" y="135.0" fill="#14263f" font-size="12">Fix it to continue to review.</text>
  <text x="24" y="172" fill="#5b6b7d" font-size="12">Full name</text><rect x="24" y="180" width="360" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="36" y="202" fill="#14263f" font-size="13">Applicant A (placeholder)</text>
  <text x="416" y="172" fill="#5b6b7d" font-size="12">Date of birth</text><rect x="416" y="180" width="360" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="428" y="202" fill="#14263f" font-size="13">01-01-1990</text>
  <text x="24" y="240" fill="#5b6b7d" font-size="12">Identity number (masked)</text><rect x="24" y="248" width="360" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="36" y="270" fill="#14263f" font-size="13">XXXX-XXXX-1234</text>
  <text x="24" y="302" fill="#5b6b7d" font-size="11">Only the last 4 digits are shown.</text>
  <text x="416" y="240" fill="#5b6b7d" font-size="12">PIN code</text><rect x="416" y="248" width="360" height="34" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="2"/><text x="428" y="270" fill="#14263f" font-size="13">12AB</text><text x="416" y="298" fill="#b42318" font-size="12">✕ Enter a 6-digit PIN code.</text>
  <text x="24" y="322" fill="#5b6b7d" font-size="12">Address line</text><rect x="24" y="330" width="752" height="34" rx="6" fill="#ffffff" stroke="#d5dee6"/><text x="36" y="352" fill="#14263f" font-size="13">House 0, Sample Street, Sample City</text>
  <rect x="536" y="420" width="110" height="36" rx="8" fill="#ffffff" stroke="#14263f"/><text x="591.0" y="443.0" fill="#14263f" font-size="14" text-anchor="middle">Save draft</text>
  <rect x="656" y="420" width="120" height="36" rx="8" fill="#0e9384"/><text x="716.0" y="443.0" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Review</text>
  <text x="24" y="444" fill="#5b6b7d" font-size="11">State shown: validation error</text>
</svg>
