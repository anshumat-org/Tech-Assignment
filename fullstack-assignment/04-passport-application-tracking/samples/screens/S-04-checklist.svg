<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Document checklist wireframe</title>
  <desc id="d">Checklist rows with missing, pending, verified and rejected chips, a reject reason and connect or upload actions. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="56" rx="0" fill="#14263f"/>
  <text x="24" y="35" fill="#ffffff" font-size="16" font-weight="700">Passport assistance (demo)</text>
  <rect x="477" y="15" width="299" height="26" rx="13" fill="#ffffff"/>
  <text x="626.5" y="32" fill="#b26a00" font-size="12" font-weight="700" text-anchor="middle">Simulated. Not the official passport system</text>
  <text x="24" y="92" fill="#14263f" font-size="16" font-weight="700">Document checklist · Scenario: fresh adult (placeholder)</text>
  <text x="24" y="114" fill="#5b6b7d" font-size="12">Each row shows status in text. Rejected rows show the reason.</text>
  <rect x="24" y="128" width="752" height="64" rx="8" fill="#ffffff" stroke="#d5dee6"/>
  <text x="40" y="156" fill="#14263f" font-size="14" font-weight="700">Proof of address</text>
  <text x="40" y="176" fill="#5b6b7d" font-size="12">Any one accepted type</text>
  <rect x="470" y="138" width="84" height="22" rx="11" fill="#ffffff" stroke="#1a7f4b"/><text x="512.0" y="153" fill="#1a7f4b" font-size="11" font-weight="700" text-anchor="middle">✓ Verified</text>
  <text x="470" y="180" fill="#5b6b7d" font-size="11">DigiLocker (mock)</text>
  <rect x="24" y="200" width="752" height="64" rx="8" fill="#ffffff" stroke="#d5dee6"/>
  <text x="40" y="228" fill="#14263f" font-size="14" font-weight="700">Proof of date of birth</text>
  <text x="40" y="248" fill="#5b6b7d" font-size="12">Uploaded · awaiting review</text>
  <rect x="470" y="210" width="77" height="22" rx="11" fill="#ffffff" stroke="#b26a00"/><text x="508.5" y="225" fill="#b26a00" font-size="11" font-weight="700" text-anchor="middle">◔ Pending</text>
  <rect x="24" y="272" width="752" height="76" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/>
  <text x="40" y="300" fill="#14263f" font-size="14" font-weight="700">Photo identity</text>
  <rect x="470" y="282" width="84" height="22" rx="11" fill="#ffffff" stroke="#b42318"/><text x="512.0" y="297" fill="#b42318" font-size="11" font-weight="700" text-anchor="middle">✕ Rejected</text>
  <text x="40" y="322" fill="#b42318" font-size="12">Reason: image is blurred, name not readable.</text>
  <rect x="640" y="300" width="120" height="36" rx="8" fill="#ffffff" stroke="#14263f"/><text x="700.0" y="323.0" fill="#14263f" font-size="14" text-anchor="middle">Re-upload</text>
  <rect x="24" y="356" width="752" height="64" rx="8" fill="#ffffff" stroke="#d5dee6"/>
  <text x="40" y="384" fill="#14263f" font-size="14" font-weight="700">Annexure (if applicable)</text>
  <text x="40" y="404" fill="#5b6b7d" font-size="12">Not provided yet</text>
  <rect x="470" y="366" width="77" height="22" rx="11" fill="#ffffff" stroke="#5b6b7d"/><text x="508.5" y="381" fill="#5b6b7d" font-size="11" font-weight="700" text-anchor="middle">○ Missing</text>
  <rect x="560" y="370" width="200" height="36" rx="8" fill="#0e9384"/><text x="660.0" y="393.0" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Connect DigiLocker (mock)</text>
  <text x="24" y="452" fill="#5b6b7d" font-size="12">Or upload instead from any row.</text>
</svg>
