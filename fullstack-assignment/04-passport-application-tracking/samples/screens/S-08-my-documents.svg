<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">My documents wireframe</title>
  <desc id="d">Linked documents as metadata with source, masked numbers and verification state; mock DigiLocker rows labelled Simulated. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="56" rx="0" fill="#14263f"/>
  <text x="24" y="35" fill="#ffffff" font-size="16" font-weight="700">Passport assistance (demo)</text>
  <rect x="477" y="15" width="299" height="26" rx="13" fill="#ffffff"/>
  <text x="626.5" y="32" fill="#b26a00" font-size="12" font-weight="700" text-anchor="middle">Simulated. Not the official passport system</text>
  <text x="24" y="92" fill="#14263f" font-size="16" font-weight="700">My documents</text>
  <text x="24" y="114" fill="#5b6b7d" font-size="12">Metadata only. Contents are not shown by default.</text>
  <rect x="24" y="130" width="752" height="180" rx="8" fill="#ffffff" stroke="#d5dee6"/>
  <rect x="24" y="130" width="752" height="36" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="34" y="152.0" fill="#5b6b7d" font-size="12" font-weight="700">Document</text><text x="224" y="152.0" fill="#5b6b7d" font-size="12" font-weight="700">Source</text><text x="424" y="152.0" fill="#5b6b7d" font-size="12" font-weight="700">Issued</text><text x="534" y="152.0" fill="#5b6b7d" font-size="12" font-weight="700">Number</text><text x="684" y="152.0" fill="#5b6b7d" font-size="12" font-weight="700">State</text>
  <line x1="24" y1="166" x2="776" y2="166" stroke="#d5dee6" stroke-width="1"/>
  <text x="34" y="188.0" fill="#14263f" font-size="12">Document A (placeholder)</text><text x="224" y="188.0" fill="#14263f" font-size="12">DigiLocker (mock) · Simulated</text><text x="424" y="188.0" fill="#14263f" font-size="12">2019</text><text x="534" y="188.0" fill="#14263f" font-size="12">XXXX-XXXX-1234</text><text x="684" y="188.0" fill="#14263f" font-size="12">✓ Verified</text>
  <line x1="24" y1="202" x2="776" y2="202" stroke="#d5dee6" stroke-width="1"/>
  <text x="34" y="224.0" fill="#14263f" font-size="12">Document B (placeholder)</text><text x="224" y="224.0" fill="#14263f" font-size="12">DigiLocker (mock) · Simulated</text><text x="424" y="224.0" fill="#14263f" font-size="12">2021</text><text x="534" y="224.0" fill="#14263f" font-size="12">XXXX-XXXX-5678</text><text x="684" y="224.0" fill="#14263f" font-size="12">◔ Pending</text>
  <line x1="24" y1="238" x2="776" y2="238" stroke="#d5dee6" stroke-width="1"/>
  <text x="34" y="260.0" fill="#14263f" font-size="12">Document C (placeholder)</text><text x="224" y="260.0" fill="#14263f" font-size="12">Upload</text><text x="424" y="260.0" fill="#14263f" font-size="12">2015</text><text x="534" y="260.0" fill="#14263f" font-size="12">XXXXXX-9012</text><text x="684" y="260.0" fill="#14263f" font-size="12">✕ Rejected</text>
  <line x1="24" y1="274" x2="776" y2="274" stroke="#d5dee6" stroke-width="1"/>
  <text x="34" y="296.0" fill="#14263f" font-size="12">Document D (placeholder)</text><text x="224" y="296.0" fill="#14263f" font-size="12">Upload</text><text x="424" y="296.0" fill="#14263f" font-size="12">2020</text><text x="534" y="296.0" fill="#14263f" font-size="12">—</text><text x="684" y="296.0" fill="#14263f" font-size="12">◔ Pending</text>
  <rect x="24" y="330" width="752" height="36" rx="6" fill="#ffffff" stroke="#1d6fe0" stroke-width="1.5"/><rect x="24" y="330" width="5" height="36" rx="2" fill="#1d6fe0"/><text x="40" y="353.0" fill="#1d6fe0" font-size="13" font-weight="700">ℹ Simulated</text><text x="128.60000000000002" y="353.0" fill="#14263f" font-size="12">Rows from DigiLocker (mock) are synthetic test data.</text>
  <text x="24" y="400" fill="#5b6b7d" font-size="12">Consent withdrawn? Mock rows become unavailable and show “Access withdrawn”.</text>
  <rect x="636" y="420" width="140" height="36" rx="8" fill="#0e9384"/><text x="706.0" y="443.0" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Add document</text>
</svg>
