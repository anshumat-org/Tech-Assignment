<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sign in wireframe</title>
  <desc id="d">Sample wireframe: sign-in card with email and password, showing the error state. Illustrative only.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Daily Notes</text>
  <rect x="616" y="70" width="160" height="22" rx="11" fill="#e8f0fe"/><text x="696" y="86" font-size="12" fill="#1d4fb0" text-anchor="middle">State: error</text>
  <rect x="220" y="104" width="360" height="340" rx="12" fill="#fff" stroke="#d5dee6"/>
  <text x="400" y="144" fill="#14263f" font-size="20" font-weight="700" text-anchor="middle">Sign in</text>
  <rect x="244" y="164" width="312" height="40" rx="8" fill="#fde8e6" stroke="#b42318"/><text x="260" y="189" fill="#b42318" font-size="13">✕ Email or password is incorrect.</text>
  <text x="244" y="232" fill="#14263f" font-size="13" font-weight="700">Email</text>
  <rect x="244" y="240" width="312" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="256" y="262" fill="#14263f" font-size="14">user@example.test</text>
  <text x="244" y="306" fill="#14263f" font-size="13" font-weight="700">Password</text>
  <rect x="244" y="314" width="312" height="36" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="256" y="336" fill="#14263f" font-size="14">••••••••</text>
  <rect x="244" y="372" width="312" height="40" rx="8" fill="#0e9384"/><text x="400" y="397" fill="#fff" font-size="14" text-anchor="middle">Sign in</text>
  <text x="400" y="432" fill="#5b6b7d" font-size="11" text-anchor="middle">Placeholder accounts only. No real credentials.</text>
</svg>
