<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Daily outliner wireframe</title>
  <desc id="d">Sample wireframe: date navigation, nested bullets with type chips, and a status bar. Illustrative only.</desc>
  <rect width="800" height="460" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">Daily Notes</text>
  <rect x="520" y="14" width="260" height="28" rx="8" fill="#16233a"/><text x="534" y="33" fill="#9fb0c4" font-size="13">Search notes…</text>
  <text x="24" y="96" fill="#14263f" font-size="22" font-weight="700">November 6, 2026</text>
  <g font-size="13" fill="#14263f" text-anchor="middle">
    <rect x="560" y="76" width="56" height="28" rx="6" fill="#fff" stroke="#d5dee6"/><text x="588" y="95">‹ Prev</text>
    <rect x="624" y="76" width="64" height="28" rx="6" fill="#0e9384"/><text x="656" y="95" fill="#fff">Today</text>
    <rect x="696" y="76" width="56" height="28" rx="6" fill="#fff" stroke="#d5dee6"/><text x="724" y="95">Next ›</text>
  </g>
  <g font-size="15" fill="#14263f">
    <circle cx="40" cy="146" r="4"/><text x="56" y="151" font-weight="700">ON Labs</text>
    <circle cx="76" cy="182" r="4"/><text x="92" y="187">Discuss architecture</text>
    <rect x="300" y="170" width="70" height="22" rx="11" fill="#e8f0fe"/><text x="335" y="186" font-size="12" fill="#1d4fb0" text-anchor="middle">Meeting</text>
    <rect x="76" y="212" width="16" height="16" rx="3" fill="#fff" stroke="#5b6b7d"/><text x="104" y="226">Finalize database schema</text>
    <rect x="300" y="208" width="70" height="22" rx="11" fill="#e3f4ea"/><text x="335" y="224" font-size="12" fill="#1a7f4b" text-anchor="middle">Task</text>
    <circle cx="40" cy="264" r="4"/><text x="56" y="269" font-weight="700">Product Development</text>
    <circle cx="76" cy="300" r="4"/><text x="92" y="305">Select PostgreSQL</text>
    <rect x="300" y="288" width="80" height="22" rx="11" fill="#fff4e0"/><text x="340" y="304" font-size="12" fill="#b26a00" text-anchor="middle">Decision</text>
    <circle cx="40" cy="342" r="4"/><text x="56" y="347" font-weight="700">Personal</text>
    <circle cx="76" cy="378" r="4"/><text x="92" y="383">Follow up on pending tasks</text>
  </g>
  <text x="440" y="151" fill="#5b6b7d" font-size="12">Tab = indent · Shift+Tab = outdent · Alt+↑/↓ = move</text>
  <rect x="0" y="424" width="800" height="36" fill="#eef3f7"/>
  <circle cx="30" cy="442" r="6" fill="#b26a00"/>
  <text x="44" y="447" fill="#14263f" font-size="13">Offline · 3 changes pending · saved on this device</text>
</svg>
