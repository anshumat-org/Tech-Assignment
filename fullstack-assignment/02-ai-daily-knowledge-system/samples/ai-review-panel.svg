<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AI review panel wireframe</title>
  <desc id="d">Sample wireframe: original note on the left, editable AI suggestions on the right with accept and dismiss. Illustrative only.</desc>
  <rect width="800" height="460" fill="#ffffff"/>
  <rect width="800" height="56" fill="#14263f"/>
  <text x="24" y="35" fill="#fff" font-size="16" font-weight="700">AI assistant · Extraction</text>
  <rect x="24" y="76" width="340" height="300" rx="8" fill="#eef3f7" stroke="#d5dee6"/>
  <text x="40" y="102" fill="#14263f" font-size="13" font-weight="700">Original note (never changed)</text>
  <text x="40" y="132" fill="#14263f" font-size="13">Discussed with the engineering team.</text>
  <text x="40" y="154" fill="#14263f" font-size="13">Finish the assessment database schema</text>
  <text x="40" y="176" fill="#14263f" font-size="13">by Friday. Rahul will handle backend APIs.</text>
  <rect x="388" y="76" width="388" height="300" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="404" y="102" fill="#14263f" font-size="13" font-weight="700">Suggested by AI. Review before applying.</text>
  <rect x="404" y="116" width="356" height="92" rx="8" fill="#fff" stroke="#0e9384" stroke-width="2"/>
  <text x="418" y="138" fill="#5b6b7d" font-size="11">TASK</text>
  <rect x="418" y="146" width="328" height="24" rx="4" fill="#eef3f7"/><text x="426" y="163" fill="#14263f" font-size="13">Finish assessment database schema</text>
  <text x="418" y="190" fill="#5b6b7d" font-size="12">Owner: Rahul · Due: Friday</text>
  <rect x="404" y="220" width="356" height="64" rx="8" fill="#fff" stroke="#d5dee6"/>
  <text x="418" y="242" fill="#5b6b7d" font-size="11">FOLLOW-UP</text>
  <text x="418" y="264" fill="#14263f" font-size="13">Backend API development</text>
  <text x="404" y="312" fill="#5b6b7d" font-size="12">Tags:</text>
  <rect x="440" y="298" width="86" height="22" rx="11" fill="#e8f0fe"/><text x="483" y="314" font-size="12" fill="#1d4fb0" text-anchor="middle">Engineering</text>
  <rect x="534" y="298" width="64" height="22" rx="11" fill="#e8f0fe"/><text x="566" y="314" font-size="12" fill="#1d4fb0" text-anchor="middle">Tasks</text>
  <rect x="404" y="334" width="100" height="30" rx="8" fill="#fff" stroke="#14263f"/><text x="454" y="354" font-size="13" fill="#14263f" text-anchor="middle">Dismiss</text>
  <rect x="580" y="334" width="180" height="30" rx="8" fill="#0e9384"/><text x="670" y="354" font-size="13" fill="#fff" text-anchor="middle">Apply selected</text>
  <rect x="24" y="396" width="752" height="40" rx="8" fill="#fff4e0" stroke="#b26a00"/>
  <text x="40" y="421" fill="#b26a00" font-size="13">If the provider fails or times out: show a message with Retry. Your notes stay usable.</text>
</svg>
